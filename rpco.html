<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPCO</title>
<style>
/* Pagina RPCO (RESULTADOS) em HTML, no visual aprovado da maquete v7 (24/11/2026).
   Cada visual HTML Content do Power BI abre esta pagina com ?b=<bloco> e os numeros na URL,
   gerados pelas medidas _mHTML_RPCO_TOPO / _MES / _ANO / _INFO. As notas vem do fluxo NPE-Ler-Notas.
   Medidas em unidades da pagina do Power BI (2560 x 1440): o visual mostra a pagina nesse tamanho. */
:root{
  --navy:#132B50; --bar:#d9dde3; --ink:#1b2430; --muted:#6b7686; --line:#c3cbd5;
  --pos:#1F4E9A; --neg:#C62828; --frame:#c9d1db;
  --pg:#B3BCC8; --ref:#0E7C66; --con:#1F4E9A; --rec:#B45309; --cri:#C62828; --sem:#9aa4b2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;}
body{position:relative;background:var(--pg);color:var(--ink);font:14px/1.35 "Segoe UI",system-ui,Arial,sans-serif}
#app{position:absolute;inset:6px;background:#fff;box-shadow:0 0 5px 1px #fff}
#app.topo{background:transparent;box-shadow:none}
.ab{position:absolute}
.bar{position:absolute;left:0;right:0;background:var(--navy);text-align:center;font-weight:800;font-size:17px;letter-spacing:.05em;line-height:26px;height:26px;color:#fff}   /* 26/11: titulos em azul com letra branca */
.box{position:absolute;overflow:auto;background:#fff;border:1px solid var(--frame)}
.title{position:absolute;left:0;top:0;right:0;height:28px;background:var(--navy);box-shadow:0 0 5px 1px #fff;text-align:center;font-weight:800;font-size:21px;letter-spacing:.04em;line-height:28px;color:#fff}
/* cartoes */
.kg{position:absolute;border:1px solid var(--frame);background:#fff;box-shadow:0 0 5px 1px #fff;border-radius:3px;overflow:hidden}
.kt{background:var(--navy);color:#fff;text-align:center;font-weight:800;font-size:18px;line-height:24px;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr 1fr .55fr;text-align:center}
.kv small{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.kv strong{display:block;font-size:27px;color:var(--pos);font-variant-numeric:tabular-nums;line-height:34px;min-height:34px;white-space:nowrap}
.n{color:var(--neg)!important}
.mg{position:absolute;display:flex;gap:10px}
.mg .grp{display:flex;flex:var(--n) 1 0;border:1px solid var(--frame);background:#fff;min-width:0;height:100%;box-shadow:0 0 5px 1px #fff;border-radius:3px;overflow:hidden}
.mg .cel{flex:1 1 0;min-width:0;border-right:1px solid var(--frame);display:flex;flex-direction:column}
.mg .cel .kv{flex:1 1 auto;align-content:center}
.mg .cel:last-child{border-right:none}
.mg .kt{font-size:17px}
.mg .kv{grid-template-columns:1fr 1fr .6fr}
.mg .kv small{font-size:12.5px;margin-top:3px}
.mg .kv strong{font-size:23px;line-height:32px;min-height:32px}
/* tabelas */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--bar);color:var(--ink);font-weight:700;font-size:14.5px;padding:3px 6px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:1px 6px;height:24px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-size:16px;color:var(--pos)}
td:first-child{text-align:left;color:var(--ink);font-weight:600;font-size:14.5px}
td.pc{text-align:right}   /* 26/11: % a direita como os demais numeros (cabecalho segue centralizado) */
td.z{color:#9aa4b2}
td.k{color:var(--ink)}
tr.tot td{font-weight:800;border-top:2px solid var(--navy);border-bottom:none;position:sticky;bottom:0;background:#fff}
#tMes td,#tMes th{padding:1px 5px;font-size:15px}
#tMes td:first-child{font-size:14.5px}
#tMes td{height:23px}
#tAno td{height:22px}
.sm table{table-layout:fixed}
.sm th{font-size:12.5px;padding:3px 6px}
.sm td{font-size:13px;height:20px;padding:1px 6px;overflow:hidden;text-overflow:ellipsis}
.sm td:first-child{font-size:12.5px}
.sm th:last-child,.sm td:last-child{width:52px}
/* painel de nota */
.np{display:grid;grid-template-rows:24px 62px 1fr;height:100%}
.np .h{background:var(--bar);color:var(--ink);font-size:13.5px;font-weight:700;text-align:center;line-height:24px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.np .k{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}
.np .k div{text-align:center;padding-top:3px;min-width:0}
.np .k small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.np .k b{display:block;font-size:24px;line-height:28px;font-variant-numeric:tabular-nums}
.np .k i{display:block;font-style:normal;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.np .c{display:grid;grid-template-columns:repeat(5,1fr)}
.np .c div{border-right:1px solid var(--line);padding:3px 3px 0;text-align:center;overflow:hidden;min-width:0}
.np .c div:last-child{border-right:none}
.np .c small{display:block;font-size:10.5px;font-weight:700;color:var(--ink);line-height:12.5px;height:25px;overflow:hidden;letter-spacing:-.1px}
.np .c b{display:block;font-size:17.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.np .c em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-ref{color:var(--ref)}.f-con{color:var(--con)}.f-rec{color:var(--rec)}.f-cri{color:var(--cri)}.f-sem{color:var(--sem)}
.msg{display:grid;place-items:center;color:var(--muted);font-size:14px;padding:8px;text-align:center}
/* resumo para a RPCO */
.rs{position:absolute;left:0;right:0;top:29px;bottom:0;background:#fff;border:1px solid var(--frame);padding:6px 10px 4px;overflow:hidden}
.rs .lv{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs .lv b{color:var(--navy)}
.rs ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.rs li{font-size:15.5px;line-height:1.35;color:var(--ink)}
.rs li b{color:var(--navy)}
.rs .pill{font-weight:700;color:var(--ink)}   /* leitura da projecao em texto simples: sem fundo nem cor */
</style>
</head>
<body>
<div id="app"></div>
<script src="resumo_rpco.js?v=2026-11-26_1130"></script>
<script>
(function(){
  var FLOW_NOTAS = "https://defaultdff5d80f6e7141999a3fbf5dc8891d.18.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/cf28ed50eda241978acc9600ed3055c8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=4QtyCBqqnuWJ-NtaYo3Zfop1KmZMJrzYu9wdUwlg0WA";   // NPE-Ler-Notas: notas gravadas (TopicoId 0) do ano
  var MESES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
  var P = new URLSearchParams(location.search);
  var B = P.get("b") || "";
  var ANO = parseInt(P.get("a"), 10) || new Date().getFullYear();
  var app = document.getElementById("app");
  app.className = B;   // topo: cartoes soltos; demais blocos: uma caixa branca com brilho
  // 26/11: o Power BI desenha o visual no tamanho da TELA (na tela ajustada a pagina, ~56% da pagina),
  // nao no tamanho da pagina do relatorio. A pagina e montada na largura do visual em unidades do relatorio
  // (DW) e escalada inteira com zoom, como os visuais nativos: faixas, margens, cartoes e listas acompanham.
  var DW = {topo:2484, mes:912, ano:912, resumo:912, info:912}[B] || 912;
  function escala(){
    var s = innerWidth / DW;
    if (!(s > 0)) return;
    document.body.style.zoom = s.toFixed(5);
    document.body.style.width = DW + "px";
    document.body.style.height = (innerHeight / s).toFixed(2) + "px";
  }
  escala();
  var nf = new Intl.NumberFormat("pt-BR", {maximumFractionDigits:0});
  var pf = new Intl.NumberFormat("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
  var p1 = new Intl.NumberFormat("pt-BR", {minimumFractionDigits:1, maximumFractionDigits:1});
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
  // lista "v.v.v" -> numeros; vazio = null; pct = valor guardado x10000
  function nums(s, pct){ return (s || "").split(".").map(function(v){ if (v === "") return null; var n = +v; return isNaN(n) ? null : (pct ? n / 10000 : n); }); }
  function txt(v, pct){ if (v === null || v === undefined) return ""; return pct ? pf.format(v * 100) + "%" : nf.format(v); }
  function cel(v, pct, extra){
    if (v === null || v === undefined) return '<td class="z ' + (pct ? "pc " : "") + (extra || "") + '"></td>';
    return '<td class="' + (v < 0 ? "n " : "") + (pct ? "pc " : "") + (extra || "") + '">' + txt(v, pct) + "</td>";
  }
  // 26/11: o tamanho real do visual no Power BI varia um pouco; em vez de barra de rolagem, a tabela
  // encolhe so o necessario para caber (zoom), no minimo 35%.
  function caber(box, el){
    if (!box || !el) return;
    el.style.zoom = "";
    var ov = box.style.overflow; box.style.overflow = "hidden";
    for (var i = 0; i < 8; i++) {
      var sh = box.scrollHeight, sw = box.scrollWidth, ch = box.clientHeight, cw = box.clientWidth;
      if (sh <= ch + 1 && sw <= cw + 1) break;
      var z = +(el.style.zoom || 1) * Math.min(ch / sh, cw / sw) * 0.995;
      el.style.zoom = Math.max(0.35, z).toFixed(4);
      if (z <= 0.35) break;
    }
    box.style.overflow = ov;
    try { app.setAttribute("aria-label", "RPCODIM " + B + " " + innerWidth + "x" + innerHeight + " box " + box.clientWidth + "x" + box.clientHeight + " zoom " + (el.style.zoom || 1)); } catch (e) {}
  }
  function caberTudo(){ [].forEach.call(document.querySelectorAll(".box"), function(b){ caber(b, b.querySelector("table")); }); var r = document.querySelector(".rs"); if (r) caber(r, r.querySelector(".rsi")); }
  function pares(s){ return (s || "").split("~").filter(Boolean).map(function(x){ var i = x.lastIndexOf("|"); return [x.slice(0, i), x.slice(i + 1)]; }); }

  // ---------- TOPO: titulo + Mes atual / Acumulado / Ano atual / Contrato + trimestres, quadrimestres e semestres ----------
  function topo(){
    var M0 = 0, GAP = 10, W = app.clientWidth - 2 * M0, c = nums(P.get("c")), p = nums(P.get("p"));
    var h = '<div class="title">RPCO - REUNIÃO DE PRESTAÇÃO DE CONTAS OPERACIONAL</div>';
    var L1 = ["MÊS ATUAL","ACUMULADO","ANO ATUAL","CONTRATO"], w = (W - 3 * GAP) / 4;
    L1.forEach(function(t, i){
      var f = c[i * 3], r = c[i * 3 + 1], m = c[i * 3 + 2] === null ? null : c[i * 3 + 2] / 10000;
      h += '<div class="kg" style="left:' + (M0 + i * (w + GAP)) + 'px;top:38px;width:' + w + 'px;height:82px"><div class="kt">' + t + '</div><div class="kv">' +
        '<div><small>FATURAMENTO</small><strong class="' + (f < 0 ? "n" : "") + '">' + txt(f) + '</strong></div>' +
        '<div><small>RESULTADO</small><strong class="' + (r < 0 ? "n" : "") + '">' + txt(r) + '</strong></div>' +
        '<div><small>%</small><strong class="' + (m < 0 ? "n" : "") + '">' + txt(m, true) + "</strong></div></div></div>";
    });
    var G = [["1º QUADRIMESTRE","2º QUADRIMESTRE","3º QUADRIMESTRE"],["1º SEMESTRE","2º SEMESTRE"]], k = 4;   // 26/11: trimestres retirados (os 4 primeiros grupos da URL ficam sem uso)
    h += '<div class="mg" style="left:' + M0 + 'px;top:130px;width:' + W + 'px;height:92px">';
    G.forEach(function(gr){
      gr.forEach(function(t){
        h += '<div class="grp" style="--n:1">';   // 26/11: um cartao por periodo, separados como os de cima
        var f = p[k * 3], r = p[k * 3 + 1], m = p[k * 3 + 2] === null ? null : p[k * 3 + 2] / 10000; k++;
        h += '<div class="cel"><div class="kt">' + t + '</div><div class="kv">' +
          '<div><small>FATURAMENTO</small><strong class="' + (f < 0 ? "n" : "") + '">' + txt(f) + '</strong></div>' +
          '<div><small>RESULTADO</small><strong class="' + (r < 0 ? "n" : "") + '">' + txt(r) + '</strong></div>' +
          '<div><small>%</small><strong class="' + (m < 0 ? "n" : "") + '">' + txt(m, true) + "</strong></div></div></div></div>";
      });
    });
    app.innerHTML = h + "</div>";
  }

  // ---------- MES A MES (12 meses + total; FCST anterior) ----------
  function mes(){
    var K = ["fat","fexe","fant","res","rexe","rant","mg","mexe","mant"], PCT = {mg:1, mexe:1, mant:1}, D = {};
    (P.get("d") || "").split("_").forEach(function(s, i){ if (K[i]) D[K[i]] = nums(s, !!PCT[K[i]]); });
    var cols = [["fat","FAT"],["fant","FAT ANT"],["fexe","FAT EXE"],["res","RES"],["rant","RES ANT"],["rexe","RES EXE"],["mg","%"],["mant","% ANT"],["mexe","% EXE"]];
    var h = '<table id="tMes"><thead><tr><th>MÊS/ANO</th>' + cols.map(function(c){ return '<th class="' + (PCT[c[0]] ? "pc" : "") + '">' + c[1] + "</th>"; }).join("") + "</tr></thead><tbody>";
    for (var i = 0; i < 12; i++) {
      var tem = cols.some(function(c){ return (D[c[0]] || [])[i] !== null && (D[c[0]] || [])[i] !== undefined; });
      if (!tem) continue;
      h += "<tr><td>" + MESES[i] + "/" + ANO + "</td>" + cols.map(function(c){ return cel((D[c[0]] || [])[i], !!PCT[c[0]]); }).join("") + "</tr>";
    }
    h += '<tr class="tot"><td>Total</td>' + cols.map(function(c){ return cel((D[c[0]] || [])[12], !!PCT[c[0]]); }).join("") + "</tr></tbody></table>";
    app.innerHTML = '<div class="bar" style="top:0">MÊS A MÊS</div><div class="box" style="left:0;right:0;top:29px;bottom:0">' + h + "</div>";
  }

  // ---------- ANO A ANO ----------
  function ano(){
    var anos = (P.get("y") || "").split(".").filter(Boolean);
    var K = ["fat","fexe","res","rexe","mg","mexe"], PCT = {mg:1, mexe:1}, D = {};
    (P.get("d") || "").split("_").forEach(function(s, i){ if (K[i]) D[K[i]] = nums(s, !!PCT[K[i]]); });
    var cols = [["fat","FAT"],["fexe","FAT EXE"],["res","RES"],["rexe","RES EXE"],["mg","%"],["mexe","% EXE"]];
    var h = '<table id="tAno"><thead><tr><th>ANO</th>' + cols.map(function(c){ return '<th class="' + (PCT[c[0]] ? "pc" : "") + '">' + c[1] + "</th>"; }).join("") + "</tr></thead><tbody>";
    anos.forEach(function(a, i){ h += "<tr><td>" + esc(a) + "</td>" + cols.map(function(c){ return cel((D[c[0]] || [])[i], !!PCT[c[0]]); }).join("") + "</tr>"; });
    h += '<tr class="tot"><td>Total</td>' + cols.map(function(c){ return cel((D[c[0]] || [])[anos.length], !!PCT[c[0]]); }).join("") + "</tr></tbody></table>";
    app.innerHTML = '<div class="bar" style="top:0">ANO A ANO</div><div class="box" style="left:0;right:0;top:29px;bottom:0">' + h + "</div>";
  }

  // ---------- INFORMACOES DIVERSAS: estagio, negocio e painel de nota ----------
  function info(){
    function lista(tit, s){
      var h = '<table><thead><tr><th>' + tit + '</th><th>QUANT.</th></tr></thead><tbody>';
      pares(s).forEach(function(x){ h += "<tr><td>" + esc(x[0]) + '</td><td class="k">' + nf.format(+x[1]) + "</td></tr>"; });
      return h + "</tbody></table>";
    }
    app.innerHTML = '<div class="bar" style="top:0">INFORMAÇÕES DIVERSAS</div>' +
      '<div class="box sm" style="left:6px;top:30px;width:208px;bottom:4px">' + lista("ESTÁGIO", P.get("e")) + "</div>" +
      '<div class="box sm" style="left:220px;top:30px;width:210px;bottom:4px">' + lista("NEGÓCIO", P.get("n")) + "</div>" +
      '<div class="box" style="left:439px;top:30px;width:444px;bottom:4px;overflow:hidden"><div class="np" id="np"><div class="h">ACOMPANHAMENTO DE PERFORMANCE</div><div class="msg" style="grid-row:2/4">Carregando as notas…</div></div></div>';
    nota(document.getElementById("np"));
  }
  function nota(el){
    var MF = parseInt(P.get("mf"), 10) || 0;
    var CHAVES = (P.get("k") || "").split("|").filter(Boolean);
    var AD = {}; (P.get("ad") || "").split(".").forEach(function(s){ var x = s.split(":"); if (x.length === 3) AD[+x[0]] = [+x[1], +x[2]]; });
    function faixa(v){ return v == null ? ["f-sem","Sem apuração"] : v >= 90 ? ["f-ref","Referência Operacional"] : v >= 70 ? ["f-con","Controlado"] : v >= 50 ? ["f-rec","Em Recuperação"] : ["f-cri","Crítico"]; }
    function fad(v){ return v == null ? "f-sem" : v >= 0.9 ? "f-ref" : v >= 0.7 ? "f-con" : v >= 0.5 ? "f-rec" : "f-cri"; }
    function media(a){ var b = a.filter(function(v){ return v !== null && v !== undefined && v !== "" && !isNaN(+v); }).map(Number); return b.length ? b.reduce(function(x, y){ return x + y; }, 0) / b.length : null; }
    function pct(v){ return v == null ? "—" : p1.format(v) + "%"; }
    var cab = '<div class="h">ACOMPANHAMENTO DE PERFORMANCE · ACUMULADO ' + (MF ? "JAN–" + MESES[MF - 1] + "/" + ANO : ANO) + "</div>";
    if (!MF) { el.innerHTML = cab + '<div class="msg" style="grid-row:2/4">Nenhum mês fechado no filtro.</div>'; return; }
    var pa = 0, ea = 0; for (var m = 1; m <= MF; m++) if (AD[m]) { pa += AD[m][0]; ea += AD[m][1]; }
    var am = AD[MF] || [0, 0], adA = ea ? pa / ea : null, adM = am[1] ? am[0] / am[1] : null, uma = CHAVES.length === 1;
    var pico = 0, mPico = 0; for (var mm = 1; mm <= MF; mm++) if (AD[mm] && AD[mm][1] >= pico) { pico = AD[mm][1]; mPico = mm; }
    var txtA = ea ? (uma ? "participou em " + pa + " de " + ea + " meses" : "pico de " + pico + " OSs elegíveis (" + MESES[mPico - 1].toLowerCase() + ")") : "sem OS elegível";
    var txtM = am[1] ? (uma ? (am[0] ? "participou em " : "não participou em ") + MESES[MF - 1].toLowerCase() : am[0] + " de " + am[1] + " OSs em " + MESES[MF - 1].toLowerCase()) : "sem OS elegível no mês";
    function desenha(notas, erro){
      var sel = {}; CHAVES.forEach(function(k){ sel[k] = 1; });
      var linhas = (notas || []).filter(function(r){ return sel[String(r.os || "")] && +r.ano === ANO && +r.mes >= 1 && +r.mes <= MF; });
      var acum = media(linhas.map(function(r){ return r.notaMes; })), fa = faixa(acum);
      var h = cab + '<div class="k">' +
        '<div><small>NOTA ACUMULADA</small><b class="' + fa[0] + '">' + pct(acum) + '</b><i class="' + fa[0] + '">' + (erro ? "notas indisponíveis" : fa[1]) + "</i></div>" +
        '<div><small>% ADESÃO ACUMULADA</small><b class="' + fad(adA) + '">' + (adA == null ? "—" : p1.format(adA * 100) + "%") + '</b><i style="color:var(--muted)">' + txtA + "</i></div>" +
        '<div><small>% ADESÃO NO MÊS</small><b class="' + fad(adM) + '">' + (adM == null ? "—" : p1.format(adM * 100) + "%") + '</b><i style="color:var(--muted)">' + txtM + "</i></div></div><div class=\"c\">";
      [["pctFinanceiro","FINANCEIRO"],["pctGovernanca","GOVERNANÇA DO CONTRATO"],["pctAcompanhamento","GESTÃO E ACOMPANHAMENTO"],["pctPessoas","PESSOAS"],["pctSSMA","SSMA E QUALIDADE"]].forEach(function(c){
        var a = media(linhas.map(function(r){ return r[c[0]]; })), f = faixa(a);
        h += "<div><small>" + c[1] + '</small><b class="' + f[0] + '">' + pct(a) + "</b><em>" + f[1] + "</em></div>";
      });
      el.innerHTML = h + "</div>";
    }
    fetch(FLOW_NOTAS, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ano:ANO})})
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ desenha(Array.isArray(j) ? j : (j && (j.value || j.notas || j.body)) || [], false); })
      .catch(function(){ desenha([], true); });
  }

  // ---------- RESUMO PARA A RPCO: o resumo gravado no fechamento (book da Aba 6), escolhido pelo filtro ----------
  var FLOW_SNAP = "https://defaultdff5d80f6e7141999a3fbf5dc8891d.18.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/07/workflows/17d843a50a304fe196cd6a75e10cd00f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=tM5zTVNKdpuNpCuQeRqKzo5oz1zNs97ya6ABTou5SNc";   // NPE-Ler-Snapshot (ano 9991 = resumos da RPCO)
  function resumo(){
    app.innerHTML = '<div class="bar" style="top:0">RESUMO PARA A RPCO · CUSTO POR HHT</div><div class="rs" id="rs"><div class="msg" style="height:100%">Carregando o resumo…</div></div>';
    var el = document.getElementById("rs"), R0 = window.NPE_RESUMO;
    var SEL = (P.get("o") || "").split(".").filter(Boolean), G = (P.get("g") || "").trim().toUpperCase(), S = (P.get("s") || "").trim().toUpperCase();
    function msg(t){ el.innerHTML = '<div class="msg" style="height:100%">' + esc(t) + "</div>"; }
    if (!R0) { msg("Resumo indisponível (script não carregou)."); return; }
    if (!SEL.length) { msg("Nenhuma OS elegível no filtro."); return; }
    function nomeBate(a, b){ a = String(a || "").toUpperCase().trim(); b = String(b || "").toUpperCase().trim(); return !!a && !!b && (a === b || a.indexOf(b + " ") === 0 || b.indexOf(a + " ") === 0 || a.indexOf(b) === 0 || b.indexOf(a) === 0); }
    function mostra(rotulo, R, cobrar, mes){
      var T = R0.textos(R); if (!T) { msg("Sem dados para o resumo."); return; }
      var cls = /OTIMISTA/.test(R.leitura) ? "bad" : (/CONSERVADORA/.test(R.leitura) ? "na" : "ok");
      var li = T.l.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("").replace("(" + esc(R.leitura) + ")", '<span class="pill ' + cls + '">' + esc(R.leitura) + "</span>");
      el.innerHTML = '<div class="rsi"><div class="lv">' + rotulo + (mes ? " · fechamento de " + MESES[mes - 1].toLowerCase() + "/" + ANO : "") + "</div><ul>" + li + (cobrar ? "<li><b>Cobrar:</b> " + esc(cobrar) + "</li>" : "") + "</ul></div>"; caber(el, el.querySelector(".rsi"));
    }
    fetch(FLOW_SNAP, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ano:9991})})
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function(txt){
        var linhas = txt.trim() ? JSON.parse(txt) : [], rec = {};
        (Array.isArray(linhas) ? linhas : []).forEach(function(l){
          var tit = String(l && l.titulo || ""); if (tit.indexOf("RPCO_") !== 0 || !l.dados) return;
          var id = parseInt(l.id, 10) || 0; if (rec[tit] && rec[tit].id >= id) return;
          var d = null; try { d = JSON.parse(l.dados); } catch (e) { return; }
          if (d && +d.ano === ANO) rec[tit] = { id: id, d: d };
        });
        var todos = Object.keys(rec).map(function(k){ return rec[k].d; });
        if (!todos.length) { msg("Ainda não há resumo gravado para " + ANO + ". Ele é gerado no fechamento do mês (Aba 6)."); return; }
        var mesRef = Math.max.apply(null, todos.map(function(d){ return +d.mes || 0; }));
        var doMes = todos.filter(function(d){ return +d.mes === mesRef; });
        // base de cada OS: registro da OS ou, se faltar, a base guardada no grupo
        var base = {}, porOS = {};
        doMes.forEach(function(d){ if (d.nivel !== "os" && d.bases) d.bases.forEach(function(b){ if (b && b.os && !base[b.os]) base[b.os] = b; }); });
        doMes.forEach(function(d){ if (d.nivel === "os" && d.R) { porOS[d.chave] = d; if (d.R.base) base[d.chave] = d.R.base; } });
        var cob = SEL.filter(function(o){ return base[o]; });
        // o nivel vale quando todas as OSs dele estao no filtro e as OSs com resumo no filtro sao dele
        // (o filtro traz tambem OSs de bloco e encerradas, que nao tem resumo proprio)
        var selS = {}; SEL.forEach(function(o){ selS[o] = 1; });
        function mesmoConjunto(d){ var a = (d.R && d.R.oss) || []; if (!a.length || !a.every(function(o){ return selS[o]; })) return false; var s = {}; a.forEach(function(o){ s[o] = 1; }); return cob.every(function(o){ return s[o]; }); }
        function nivelTxt(n){ return n === "ger" ? "Gerência" : n === "sup" ? "Superintendência" : n === "dir" ? "Empresa" : "OS"; }
        var grupos = doMes.filter(function(d){ return d.nivel !== "os" && d.R; });
        var achou = null;
        if (SEL.length === 1 || cob.length === 1) { var o1 = cob[0] || SEL[0]; achou = porOS[o1] || null; if (!achou && base[o1]) { mostra("OS <b>" + esc(base[o1].nome || o1) + "</b>", R0.deBases([base[o1]], "os", base[o1].nome), "", mesRef); return; } }
        if (!achou && G) achou = grupos.filter(function(d){ return d.nivel === "ger" && nomeBate(d.nome || d.chave, G); })[0] || null;
        if (!achou && S && !G) achou = grupos.filter(function(d){ return d.nivel === "sup" && nomeBate(d.nome || d.chave, S); })[0] || null;
        if (!achou) achou = grupos.filter(function(d){ return mesmoConjunto(d); }).sort(function(a, b){ return b.R.oss.length - a.R.oss.length; })[0] || null;   // o maior nivel que cabe inteiro no filtro
        if (achou) { mostra(achou.nivel === "dir" ? "<b>Empresa</b>" : nivelTxt(achou.nivel) + " <b>" + esc(achou.nome || achou.chave) + "</b>" + (achou.nivel !== "os" ? " · " + achou.R.nOS + " OSs" : ""), achou.R, achou.cobrar || "", mesRef); return; }
        if (!cob.length) { msg("As OSs do filtro ainda não têm resumo gravado. Ele é gerado no fechamento do mês (Aba 6)."); return; }
        var R = R0.deBases(cob.map(function(o){ return base[o]; }), "sel", cob.length + " OSs");
        var cobr = cob.length <= 3 ? cob.filter(function(o){ return porOS[o] && porOS[o].cobrar; }).map(function(o){ return o + ": " + porOS[o].cobrar; }).join(" | ") : "";
        mostra("Seleção de <b>" + cob.length + " OSs</b>" + (cob.length < SEL.length ? " (" + (SEL.length - cob.length) + " sem resumo gravado)" : ""), R, cobr, mesRef);
      })
      .catch(function(e){ msg("Não consegui ler o resumo (" + e.message + ")."); });
  }

  try {
    if (B === "topo") topo(); else if (B === "mes") mes(); else if (B === "ano") ano(); else if (B === "info") info(); else if (B === "resumo") resumo();
    else app.innerHTML = '<div class="msg" style="height:100%">Bloco não informado.</div>';
    if (B !== "topo") caberTudo();
  } catch (e) { app.innerHTML = '<div class="msg" style="height:100%">Erro ao montar o bloco: ' + esc(e.message) + "</div>"; }
  window.addEventListener("resize", function(){ escala(); if (B === "topo") topo(); else caberTudo(); });
  // o visual do Power BI pode abrir a pagina antes de ter o tamanho final: refaz o ajuste depois
  [300, 1200, 3000].forEach(function(ms){ setTimeout(function(){ escala(); if (B === "topo") topo(); else caberTudo(); }, ms); });
  if (B !== "topo") { if (document.fonts && document.fonts.ready) document.fonts.ready.then(caberTudo); }
})();
</script>
