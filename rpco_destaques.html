<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPCO · Destaques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0b1a3a;
    --bg-bar: #10244d;
    --bg-card: #ffffff;
    --bg-soft: #f1f5f9;
    --bg-sub: #f8fafc;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --accent-soft: #eff6ff;
    --ok: #16a34a;
    --warn-bg: #fef3c7;
    --danger: #b91c1c;
    --danger-bg: #fee2e2;
    --text: #0f172a;
    --muted: #475569;
    --line: #cbd5e1;
    --line-soft: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; background: var(--bg-main); color: var(--text); font-size: 14px; position: relative; }
  button, input { font-family: inherit; font-size: inherit; }
  .app { padding: 16px 20px 40px; }

  .topo { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--bg-bar); border: 1px solid #1e3a70; border-radius: 12px; padding: 12px 18px; color: #e2e8f0; }
  .marca { font-weight: 800; font-size: 1.15rem; letter-spacing: .02em; color: #fff; }
  .marca span { font-weight: 600; font-size: .85rem; color: #93c5fd; margin-left: 10px; letter-spacing: .06em; }
  .sessao { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .85rem; }
  .pill { background: #1d4ed8; color: #fff; border-radius: 999px; padding: 3px 10px; font-weight: 800; font-size: .72rem; letter-spacing: .06em; }
  .pill.prop { background: #047857; }
  .btn { border: none; border-radius: 8px; padding: 8px 14px; font-weight: 800; cursor: pointer; background: var(--accent); color: #fff; white-space: nowrap; }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.sec { background: #e2e8f0; color: #334155; }
  .btn.sec:hover { background: #cbd5e1; }
  .btn.ok { background: var(--ok); }
  .btn.peq { padding: 5px 10px; font-size: .76rem; }
  .btn:focus-visible, input:focus-visible, .combo:focus-visible { outline: 3px solid #93c5fd; outline-offset: 1px; }

  .abas { display: flex; gap: 6px; margin: 14px 0 0; flex-wrap: wrap; }
  .aba { background: transparent; color: #cbd5e1; border: 1px solid #1e3a70; border-bottom: none; border-radius: 10px 10px 0 0; padding: 10px 18px; font-weight: 700; cursor: pointer; }
  .aba.on { background: var(--bg-card); color: var(--text); border-color: var(--bg-card); }
  .painel { background: var(--bg-card); border-radius: 0 12px 12px 12px; padding: 20px; min-height: 400px; }

  .aviso { border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .aviso h3 { font-size: 1rem; margin-bottom: 4px; }
  .aviso p { color: var(--muted); font-size: .86rem; }
  .aviso.warn { background: var(--warn-bg); border: 1px solid #fcd34d; }
  .aviso.warn h3 { color: #92400e; }
  .aviso.erro { background: var(--danger-bg); border: 1px solid #fecaca; }
  .aviso.erro h3 { color: #991b1b; }
  .aviso.info { background: var(--accent-soft); border: 1px solid #bfdbfe; }
  .aviso.info h3 { color: #1e3a8a; }
  .codigos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .codigos button { border: 1px solid #fcd34d; background: #fff; border-radius: 6px; padding: 3px 8px; font-weight: 700; font-size: .78rem; cursor: pointer; color: #92400e; }
  .aviso.erro .codigos button { border-color: #fecaca; color: #991b1b; }

  .login { max-width: 380px; margin: 40px auto; border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  .login h2 { font-size: 1.1rem; margin-bottom: 4px; }
  .login p { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .login label { display: block; font-size: .74rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 4px; }
  .login input { width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 8px; }
  .login .btn { width: 100%; margin-top: 16px; padding: 10px; }

  .barra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .barra input[type=search] { flex: 1 1 260px; max-width: 420px; padding: 8px 11px; border: 1.5px solid var(--line); border-radius: 8px; }
  .barra .status { font-size: .84rem; font-weight: 700; color: var(--muted); }
  .barra .status.ok { color: var(--ok); }
  .barra .status.erro { color: var(--danger); }
  .barra .dir { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .confirma { background: var(--accent-soft); border: 1px solid #93c5fd; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  .grupo-titulo { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
  .caixa { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; background: #fff; }
  .caixa-topo { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
  .caixa-topo h2 { font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase; }
  .caixa-topo h3 { font-size: 1rem; }
  .caixa-topo h4 { font-size: .92rem; }
  .caixa-topo .dir { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .caixa.super > .caixa-topo { background: var(--bg-soft); border-radius: 12px 12px 0 0; }
  .caixa.sub { margin: 0 0 12px; background: var(--bg-sub); border-color: var(--line-soft); }
  .caixa.sub > .caixa-topo { border-bottom-color: var(--line-soft); }
  .gerentes { padding: 12px 14px 2px; }
  .gerentes-titulo { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .papel { font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .dica { color: var(--muted); font-size: .8rem; }
  .nota { color: var(--muted); font-size: .76rem; font-style: italic; }
  .tot { display: inline-flex; gap: 12px; align-items: baseline; background: var(--accent-soft); border: 1px solid #bfdbfe; color: #1e3a8a; border-radius: 8px; padding: 5px 10px; font-size: .78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tot b { font-size: .95rem; color: #0f172a; }
  .tot.leve { background: #fff; border-color: var(--line-soft); color: var(--muted); }
  .tot.leve b { font-size: .84rem; color: var(--muted); }
  .conferencia { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; font-size: .78rem; color: var(--muted); border-top: 1px dashed var(--line-soft); }
  .dif { font-weight: 800; }
  .dif.ok { color: var(--ok); }
  .dif.alerta { color: #b45309; }

  .rolagem { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  th { text-align: left; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  th.n, td.n { text-align: right; }
  td.n { font-variant-numeric: tabular-nums; }
  tr.pend td { background: #fffbeb; }
  tr.foco td { background: #dbeafe !important; }
  tr.novo td { background: #f0fdf4; }
  tr.desativada td { opacity: .45; text-decoration: line-through; }
  tr.grupo-linha td { background: var(--bg-soft); border-top: 2px solid var(--line); padding: 8px; }
  tr.grupo-linha b { font-size: .86rem; }
  td input.v { width: 104px; text-align: right; padding: 5px 7px; border: 1.5px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums; }
  td input.v.calc { background: var(--bg-soft); color: var(--muted); }
  td input.t { width: 100%; min-width: 140px; padding: 5px 7px; border: 1.5px solid var(--line); border-radius: 6px; }
  td input.t + input.t { margin-top: 4px; }
  td input.alterado, .combo.alterado { border-color: #f59e0b; }
  .combo { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 130px; width: 100%; max-width: 250px; padding: 5px 8px; border: 1.5px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); cursor: pointer; text-align: left; }
  .combo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .combo i { font-style: normal; color: var(--muted); font-size: .7rem; }
  .combo.vazio span { color: #94a3b8; }
  .flutuante { position: absolute; z-index: 50; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(15, 23, 42, .22); max-height: 300px; overflow-y: auto; padding: 4px; }
  .flutuante .filtro-combo { width: 100%; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 6px; margin-bottom: 4px; }
  .opcao { padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: .84rem; }
  .opcao.ativa { background: #dbeafe; }
  .opcao.atual { font-weight: 800; }
  .os { font-weight: 800; }
  tr[data-os] td:first-child, tr.prosp td:first-child { min-width: 230px; }
  .desc { color: var(--muted); font-size: .78rem; }
  .chip { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: .7rem; font-weight: 800; white-space: nowrap; margin: 1px 2px 1px 0; }
  .chip.sem { background: var(--warn-bg); color: #92400e; }
  .chip.def { background: #dcfce7; color: #166534; }
  .chip.fora { background: #e2e8f0; color: #334155; }
  .chip.viol { background: var(--danger-bg); color: #991b1b; }
  .chip.sync { background: #dbeafe; color: #1e40af; }
  .chip.pros { background: #ede9fe; color: #5b21b6; }
  .vazio { color: var(--muted); padding: 12px 14px; font-size: .84rem; }
  .x { background: none; border: none; color: #94a3b8; font-weight: 800; cursor: pointer; font-size: 1rem; padding: 0 4px; }
  .x:hover { color: var(--danger); }
  .construcao { padding: 60px 20px; text-align: center; color: var(--muted); }
  .construcao h2 { color: var(--text); margin-bottom: 6px; }
  .diag { margin-top: 12px; font-size: .7rem; color: #64748b; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="topo">
    <div class="marca">NPE<span id="subtitulo">RPCO</span></div>
    <div class="sessao" id="sessao"></div>
  </div>
  <div class="abas" role="tablist" id="abas"></div>
  <div class="painel" id="painel"></div>
  <div class="diag" id="diag"></div>
</div>
<div id="flutuante" class="flutuante" hidden></div>

<script>
(function () {
  "use strict";

  // ===========================================================================
  // Fluxos (Power Automate). Ler e Gravar conferem login + hash na PARAM_ACESSO:
  // ler exige Master ativo, gravar exige o PROPRIETARIO.
  // ===========================================================================
  var FLOW = {
    login:  "https://defaultdff5d80f6e7141999a3fbf5dc8891d.18.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/bcf1295963df418f91a48dd71ea02e60/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=VfbYQC2H12f_6GZCSMmrctJBKF1B8ns4TalVByCO688",
    ler:    "https://defaultdff5d80f6e7141999a3fbf5dc8891d.18.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/a343fee6cc6345d681e0dd483dbb9d05/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=3nqkHSexMoJM-hcvhonWaF5vzaYENBy8ONwHhwyNEww",
    gravar: "https://defaultdff5d80f6e7141999a3fbf5dc8891d.18.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/03/workflows/f42b6d3d1a8f45588136d0ce70d2d2ab/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=npaAIzRXLDdrejvhShfxykRxpHqrX2iiPHH373XtEo8"
  };
  var ITERACOES = 200000;
  // Os unicos superintendentes operacionais (decisao do usuario, 15/09/2026). Os nomes vem da CTT.
  var SUPER_OPERACIONAIS = ["000096", "000070", "000238", "000117"];
  var ESTAGIOS = { E: "EXECUCAO", N: "NOVA", D: "DEMOBILIZACAO", F: "FINALIZADA", X: "" };
  var LOTE = 20;

  // ===========================================================================
  // Dados da CTT, montados pela medida _mHTML_RPCO
  //   GER = codigo:nome:codigo do superintendente | SUP = codigo:nome
  //   OS  = codigo,descricao,gerente,super,negocio(i),classificacao(i),status(A/U)+estagio
  // ===========================================================================
  var P = new URLSearchParams(location.search);
  var ANO = parseInt(P.get("Ano"), 10) || new Date().getFullYear();
  var TEM_CTT = P.has("OS");
  function pad6(c) { c = String(c || "").trim(); return c && /^\d+$/.test(c) ? ("000000" + c).slice(-6) : c; }
  function lista(nome) { return String(P.get(nome) || "").split("|").filter(Boolean); }
  var NEG = lista("NEG"), CLS = lista("CLS");
  var GER = {}, SUP = {};
  lista("GER").forEach(function (x) { var p = x.split(":"); if (p.length >= 2 && !GER[pad6(p[0])]) GER[pad6(p[0])] = { nome: p[1], sup: pad6(p[2] || "") }; });
  lista("SUP").forEach(function (x) { var i = x.indexOf(":"); if (i > 0) SUP[pad6(x.slice(0, i))] = x.slice(i + 1); });
  var OS_CTT = {};
  String(P.get("OS") || "").split(";").filter(Boolean).forEach(function (l) {
    var f = l.split(",");
    if (f.length < 7) return;
    var fl = f[6] || "";
    OS_CTT[f[0]] = {
      cod: f[0], desc: f[1], codGer: pad6(f[2]), codSup: pad6(f[3]),
      negocio: NEG[+f[4]] || "", classificacao: CLS[+f[5]] || "",
      status: fl.charAt(0) === "A" ? "ATIVO" : "ATUAL",
      estagio: ESTAGIOS.hasOwnProperty(fl.charAt(1)) ? ESTAGIOS[fl.charAt(1)] : fl.charAt(1)
    };
  });
  // Regra da CTT: ATIVO so em EXECUCAO/DEMOBILIZACAO/NOVA; ATUAL sempre FINALIZADA.
  // ATUAL + FINALIZADA continua no acompanhamento; so ENCERRADO sai (e nem chega aqui).
  function violacao(o) {
    if (o.status === "ATIVO" && ["EXECUCAO", "DEMOBILIZACAO", "NOVA"].indexOf(o.estagio) < 0) return "ATIVO · " + (o.estagio || "SEM ESTAGIO");
    if (o.status === "ATUAL" && o.estagio !== "FINALIZADA") return "ATUAL · " + (o.estagio || "SEM ESTAGIO");
    return "";
  }

  // ===========================================================================
  // Sessao: dentro do visual do Power BI so o window.name atravessa a recarga do iframe.
  // Guarda o hash (nunca a senha) para ler/gravar sem pedir login a cada filtro; expira em 8 h.
  // ===========================================================================
  var PREFIXO = "NPERPCO1:";
  var sessao = null;
  function lerSessao() {
    try {
      if (String(window.name).indexOf(PREFIXO) === 0) {
        var s = JSON.parse(window.name.slice(PREFIXO.length));
        if (s && s.login && s.hash && Date.now() - s.ts < 8 * 3600 * 1000) return s;
      }
    } catch (e) {}
    return null;
  }
  function gravarSessao(s) { try { window.name = s ? PREFIXO + JSON.stringify(s) : ""; } catch (e) {} }
  function ehProprietario() { return !!sessao && sessao.perfil === "PROPRIETARIO"; }

  async function derivarHash(login, senha) {
    var enc = new TextEncoder();
    var chave = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(String(login).toLowerCase().trim()), iterations: ITERACOES, hash: "SHA-256" }, chave, 256);
    return Array.from(new Uint8Array(bits)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  async function postar(url, corpo) {
    var r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    var txt = await r.text();
    var json = null;
    try { json = txt ? JSON.parse(txt) : null; } catch (e) {}
    return { status: r.status, json: json };
  }

  // ===========================================================================
  // Estado
  // ===========================================================================
  var abaAtiva = "metas";
  var linhas = [];
  var carregando = false, erroCarga = "", filtro = "", msgStatus = "", corStatus = "";
  var confirmando = false, gravando = false, focoAlvo = "";
  var seq = 0;

  var CAMPOS_TXT = ["Title", "Nivel", "CodOS", "CodGerente", "Gerente", "CodSuperintendente", "Superintendente", "Negocio", "Classificacao", "ClassificacaoAdicional", "Descricao", "Cliente", "Nome", "EntradaPor", "Situacao", "Ativo", "Origem"];
  var CAMPOS_EDIT = ["CodGerente", "Gerente", "CodSuperintendente", "Superintendente", "Negocio", "Classificacao", "ClassificacaoAdicional", "Descricao", "Cliente", "FatMeta", "ResMeta", "MargemMeta", "EntradaPor", "Ativo"];
  function normalizar(it) {
    var r = { uid: "r" + (++seq), id: parseInt(it.ID || it.Id || it.id, 10) || 0 };
    CAMPOS_TXT.forEach(function (c) { r[c] = it[c] == null ? "" : String(it[c]); });
    ["FatMeta", "ResMeta", "MargemMeta"].forEach(function (c) { r[c] = it[c] == null || it[c] === "" ? null : Number(it[c]); });
    r.Ano = Number(it.Ano) || 0;
    snapshot(r);
    return r;
  }
  function linhaVazia(nivel) {
    var r = { uid: "n" + (++seq), id: 0, Ano: ANO, FatMeta: null, ResMeta: null, MargemMeta: null };
    CAMPOS_TXT.forEach(function (c) { r[c] = ""; });
    r.Nivel = nivel; r.EntradaPor = "RESULTADO"; r.Ativo = "Sim";
    snapshot(r);
    return r;
  }
  function snapshot(r) { r._orig = {}; CAMPOS_EDIT.forEach(function (c) { r._orig[c] = r[c]; }); }
  function numIgual(a, b) {
    if (typeof a === "number" || typeof b === "number") {
      if (a == null || b == null) return a == b;
      return Math.abs(a - b) < 1e-6;
    }
    return String(a == null ? "" : a) === String(b == null ? "" : b);
  }
  function alterado(r, c) { return !numIgual(r[c], r._orig[c]); }
  function linhaAlterada(r) { return CAMPOS_EDIT.some(function (c) { return alterado(r, c); }); }
  function ativa(r) { return r.Ativo !== "Nao"; }

  // ===========================================================================
  // Formatacao (gravado em reais; digitado e exibido em R$ milhoes)
  // ===========================================================================
  function fmtMi(v) { return v == null || isNaN(v) ? "" : (v / 1e6).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtPct(m) { return m == null || isNaN(m) ? "" : (m * 100).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%"; }
  function lerNumero(s) {
    s = String(s || "").replace(/R\$|%|\s/g, "");
    if (!s) return null;
    if (s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
    var n = parseFloat(s);
    return isFinite(n) ? n : NaN;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function semAcento(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function unicos(a) { return a.filter(function (v, i) { return v && a.indexOf(v) === i; }).sort(); }

  // ===========================================================================
  // Nomes e hierarquia: sempre a CTT; a lista so quando o codigo nao esta na CTT ativa
  // ===========================================================================
  function nomeGer(cod, doLista) { return (GER[cod] && GER[cod].nome) || doLista || cod || ""; }
  function nomeSup(cod, doLista) { return SUP[cod] || doLista || cod || ""; }
  // "PROCX" do superintendente: o gerente escolhido define o superintendente cadastrado na CTT
  function supDoGerente(codGer) {
    if (GER[codGer] && GER[codGer].sup) return GER[codGer].sup;
    var l = linhas.filter(function (r) { return r.CodGerente === codGer && r.CodSuperintendente; })[0];
    return l ? l.CodSuperintendente : "";
  }
  function nomeSupDoGerente(codGer) {
    var s = supDoGerente(codGer);
    var l = linhas.filter(function (r) { return r.CodSuperintendente === s && r.Superintendente; })[0];
    return nomeSup(s, l ? l.Superintendente : "");
  }
  function porNomeGer(a, b) { return nomeGer(a).localeCompare(nomeGer(b)); }
  function porNomeSup(a, b) { return nomeSup(a).localeCompare(nomeSup(b)); }
  function gerentesComOS() { var m = {}; Object.keys(OS_CTT).forEach(function (k) { m[OS_CTT[k].codGer] = 1; }); return m; }
  function temMetaGerente(g) { return linhas.some(function (r) { return r.Nivel === "GERENTE" && r.CodGerente === g && ativa(r); }); }
  function gerentesDoSuper(s) {
    var comOS = gerentesComOS(), m = {};
    Object.keys(GER).forEach(function (g) { if (GER[g].sup === s && (comOS[g] || temMetaGerente(g))) m[g] = 1; });
    linhas.forEach(function (r) { if (r.Nivel === "GERENTE" && r.CodGerente && !GER[r.CodGerente] && r.CodSuperintendente === s) m[r.CodGerente] = 1; });
    return Object.keys(m).sort(porNomeGer);
  }
  function opcoesNeg() { return NEG.length ? NEG : unicos(linhas.map(function (r) { return r.Negocio; })); }
  function opcoesCls() { return CLS.length ? CLS : unicos(linhas.map(function (r) { return r.Classificacao; })); }
  function opcoesGer() {
    var m = {};
    Object.keys(GER).forEach(function (c) { m[c] = GER[c].nome; });
    linhas.forEach(function (r) { if (r.CodGerente && !m[r.CodGerente]) m[r.CodGerente] = r.Gerente || r.CodGerente; });
    return Object.keys(m).map(function (c) { return [c, m[c]]; }).sort(function (a, b) { return a[1].localeCompare(b[1]); });
  }
  function opcoesCampo(campo) {
    if (campo === "Negocio") return [["", "(em branco)"]].concat(opcoesNeg().map(function (v) { return [v, v]; }));
    if (campo === "Classificacao") return [["", "(em branco)"]].concat(opcoesCls().map(function (v) { return [v, v]; }));
    if (campo === "CodGerente") return opcoesGer();
    return [];
  }

  // ===========================================================================
  // OS: a CTT define quem aparece; a lista traz a meta. Prospeccoes ficam junto do gerente.
  // ===========================================================================
  function linhaOS(cod) { return linhas.filter(function (r) { return r.Nivel === "OS" && r.CodOS === cod; })[0]; }
  function montarOS() {
    var saida = [], vistos = {};
    Object.keys(OS_CTT).sort().forEach(function (cod) {
      var o = OS_CTT[cod], r = linhaOS(cod);
      if (!r) {
        r = linhaVazia("OS");
        r.uid = "os-" + cod; r.CodOS = cod; r.Title = ANO + "|OS|" + cod; r._virtual = true;
        snapshot(r);
        linhas.push(r);
      }
      vistos[cod] = true;
      saida.push({ tipo: "OS", r: r, ctt: o, ger: o.codGer });
    });
    linhas.forEach(function (r) {
      if (r.Nivel === "OS" && !vistos[r.CodOS] && !r._virtual) saida.push({ tipo: "OS", r: r, ctt: null, ger: r.CodGerente });
    });
    return saida;
  }
  function itensBlocoOS() {
    return montarOS().concat(linhas.filter(function (r) { return r.Nivel === "PROSPECCAO"; }).map(function (r) { return { tipo: "P", r: r, ctt: null, ger: r.CodGerente }; }));
  }
  function divergenciasCTT(x) {
    var o = x.ctt, r = x.r;
    if (!o) return [];
    var d = [];
    if (o.codGer !== r.CodGerente || nomeGer(o.codGer) !== r.Gerente) d.push("gerente");
    if (o.codSup !== r.CodSuperintendente || nomeSup(o.codSup) !== r.Superintendente) d.push("superintendente");
    if (o.negocio !== r.Negocio) d.push("negocio");
    if (o.classificacao !== r.Classificacao) d.push("classificacao");
    return d;
  }
  function aplicarCTT(x) {
    var o = x.ctt, r = x.r;
    r.CodGerente = o.codGer; r.Gerente = nomeGer(o.codGer);
    r.CodSuperintendente = o.codSup; r.Superintendente = nomeSup(o.codSup);
    r.Negocio = o.negocio; r.Classificacao = o.classificacao;
  }
  // Linhas com gerente (meta de gerente, prospeccao, Locacoes): superintendente e nome vem da CTT
  function divergeCTTLinha(r) {
    if (r.CodGerente && GER[r.CodGerente]) {
      var s = GER[r.CodGerente].sup;
      if (r.Gerente !== GER[r.CodGerente].nome || r.CodSuperintendente !== s || (SUP[s] && r.Superintendente !== SUP[s])) return true;
    }
    if (r.Nivel === "SUPERINTENDENTE" && SUP[r.CodSuperintendente] && r.Superintendente !== SUP[r.CodSuperintendente]) return true;
    return false;
  }
  function aplicarCTTLinha(r) {
    if (r.CodGerente && GER[r.CodGerente]) {
      r.Gerente = GER[r.CodGerente].nome;
      r.CodSuperintendente = GER[r.CodGerente].sup;
      if (SUP[r.CodSuperintendente]) r.Superintendente = SUP[r.CodSuperintendente];
    }
    if (r.Nivel === "SUPERINTENDENTE" && SUP[r.CodSuperintendente]) r.Superintendente = SUP[r.CodSuperintendente];
  }

  // ===========================================================================
  // Totais (cabecalhos das caixas e subtotais), recalculados no lugar
  // ===========================================================================
  function linhasDoTotal(k) {
    var i = k.indexOf(":"), t = i < 0 ? k : k.slice(0, i), c = i < 0 ? "" : k.slice(i + 1);
    if (t === "E") return linhas.filter(function (r) { return r.Nivel === "EMPRESA"; });
    if (t === "S") return linhas.filter(function (r) { return r.Nivel === "SUPERINTENDENTE" && r.CodSuperintendente === c; });
    if (t === "G") return linhas.filter(function (r) { return r.Nivel === "GERENTE" && r.CodGerente === c; });
    if (t === "SG") { var gs = gerentesDoSuper(c); return linhas.filter(function (r) { return r.Nivel === "GERENTE" && gs.indexOf(r.CodGerente) >= 0; }); }
    if (t === "L") return linhas.filter(function (r) { return r.Nivel === "NEGOCIO"; });
    if (t === "OG") return itensBlocoOS().filter(function (x) { return x.ger === c; }).map(function (x) { return x.r; });
    if (t === "OS") return itensBlocoOS().map(function (x) { return x.r; });
    return [];
  }
  function somar(rs) {
    var f = 0, r = 0, n = 0;
    rs.forEach(function (x) { if (!ativa(x)) return; if (x.FatMeta != null) { f += x.FatMeta; n++; } if (x.ResMeta != null) r += x.ResMeta; });
    return { f: f, r: r, n: n };
  }
  function conteudoTotal(k) {
    if (k.indexOf("D:") === 0) {
      var s = k.slice(2), a = somar(linhasDoTotal("S:" + s)), b = somar(linhasDoTotal("SG:" + s));
      if (!a.n) return "";
      var dif = b.f - a.f;
      return Math.abs(dif) < 5000 ? '<span class="dif ok">bate com a meta do superintendente</span>' : '<span class="dif alerta">diferença de ' + fmtMi(dif) + " mi no faturamento</span>";
    }
    var t = somar(linhasDoTotal(k));
    if (!t.n) return '<span class="chip sem">sem meta</span>';
    return "<span>FAT <b>" + fmtMi(t.f) + "</b></span><span>RES <b>" + fmtMi(t.r) + "</b></span><span><b>" + (t.f ? fmtPct(t.r / t.f) : "—") + "</b></span>";
  }
  function htmlTotal(k, leve) { return '<span class="' + (k.indexOf("D:") === 0 ? "" : "tot" + (leve ? " leve" : "")) + '" data-tot="' + esc(k) + '">' + conteudoTotal(k) + "</span>"; }
  function atualizarTotais() {
    document.querySelectorAll("[data-tot]").forEach(function (el) { el.innerHTML = conteudoTotal(el.getAttribute("data-tot")); });
  }

  // ===========================================================================
  // Carga
  // ===========================================================================
  async function carregar() {
    if (!sessao) return;
    carregando = true; erroCarga = ""; render();
    try {
      var res = await postar(FLOW.ler, { login: sessao.login, hash: sessao.hash });
      if (res.status === 403) { erroCarga = "Acesso restrito a usuários Master. Entre novamente."; sessao = null; gravarSessao(null); }
      else if (res.status !== 200 || !Array.isArray(res.json)) { erroCarga = "Não foi possível ler as metas (HTTP " + res.status + ")."; }
      else {
        seq = 0;
        linhas = res.json.map(normalizar).filter(function (r) { return r.Ano === ANO && r.Ativo !== "Nao"; });
      }
    } catch (e) {
      erroCarga = "Não foi possível ler as metas agora. Verifique a conexão e tente de novo.";
    }
    carregando = false;
    render();
  }

  // ===========================================================================
  // Renderizacao
  // ===========================================================================
  var ABAS = [["metas", "Metas"], ["operacional", "Acompanhamento Operacional"], ["destaques", "Destaques"], ["gerenciais", "Gerenciais"]];
  function render() {
    fecharCombo();
    document.getElementById("subtitulo").textContent = "RPCO · " + ANO;

    document.getElementById("abas").innerHTML = ABAS.map(function (a) {
      return '<button type="button" role="tab" class="aba' + (a[0] === abaAtiva ? " on" : "") + '" aria-selected="' + (a[0] === abaAtiva) + '" data-aba="' + a[0] + '">' + a[1] + "</button>";
    }).join("");
    var painel = document.getElementById("painel");
    if (!sessao) { painel.innerHTML = htmlLogin(); ligarLogin(); }
    else if (abaAtiva !== "metas") painel.innerHTML = '<div class="construcao"><h2>' + esc(ABAS.filter(function (a) { return a[0] === abaAtiva; })[0][1]) + "</h2><p>Aba em construção: entra depois da confirmação da aba Metas.</p></div>";
    else painel.innerHTML = htmlMetas();
    document.getElementById("diag").textContent = TEM_CTT
      ? "CTT: " + Object.keys(OS_CTT).length + " OS · " + Object.keys(GER).length + " gerentes · " + Object.keys(SUP).length + " superintendentes"

    if (focoAlvo) {

    }

  function renderSessao() {
    var el = document.getElementById("sessao");
    if (!sessao) { el.innerHTML = "<span>Acesso restrito ao Setor de Performance</span>"; return; }
    el.innerHTML = "<b>" + esc(sessao.nome || sessao.login) + '</b><span class="pill' + (ehProprietario() ? " prop" : "") + '">' + esc(sessao.perfil) + "</span>" +
      '<button type="button" class="btn sec peq" data-acao="sair">Sair</button>';
  }

  // Sem <form>: o iframe do visual HTML do Power BI e sandbox sem allow-forms e bloqueia o envio.
  function htmlLogin(msg, loginDigitado) {
    return '<div class="login" id="formLogin">' +
      "<h2>Metas do ano · só Master</h2>" +
      "<p>Entre com o mesmo usuário do Acompanhamento Mensal.</p>" +
      (erroCarga ? '<div class="aviso erro"><p>' + esc(erroCarga) + "</p></div>" : "") +
      '<div class="aviso erro" id="lgMsg"' + (msg ? "" : " hidden") + "><p>" + esc(msg || "") + "</p></div>" +
      '<label for="lgUsuario">Usuário</label><input id="lgUsuario" type="text" autocomplete="off" value="' + esc(loginDigitado || "") + '">' +
      '<label for="lgSenha">Senha</label><input id="lgSenha" type="password" autocomplete="off">' +
      '<button type="button" class="btn" id="lgEntrar">Entrar</button></div>';
  }
  function ligarLogin() {
    var btn = document.getElementById("lgEntrar");
    if (!btn) return;
    btn.addEventListener("click", entrar);
    ["lgUsuario", "lgSenha"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); entrar(); } });
    });
  }
  function avisoLogin(msg, login) {
    document.getElementById("painel").innerHTML = htmlLogin(msg, login);

    var s = document.getElementById(login ? "lgSenha" : "lgUsuario");

  }
  async function entrar() {
    var btn = document.getElementById("lgEntrar");
    if (!btn || btn.disabled) return;
    var login = document.getElementById("lgUsuario").value.toLowerCase().trim();
    var senha = document.getElementById("lgSenha").value;
    if (!login || !senha) { avisoLogin("Informe usuário e senha.", login); return; }
    btn.disabled = true; btn.textContent = "Verificando...";
    try {
      if (!window.crypto || !crypto.subtle) { avisoLogin("Este navegador não permite validar a senha aqui (criptografia indisponível).", login); return; }
      var hash = await derivarHash(login, senha);
      var res = await postar(FLOW.login, { login: login, hash: hash });
      if (res.status !== 200 || !res.json || res.json.ok !== true) {
        avisoLogin(res.status === 200 ? "Usuário ou senha incorretos." : "Falha ao consultar o servidor (HTTP " + res.status + ").", login);
        return;
      }
      sessao = { login: login, nome: res.json.nome || login, perfil: res.json.perfil || "MASTER", hash: hash, ts: Date.now() };
      gravarSessao(sessao);
      erroCarga = "";
      carregar();
    } catch (e) {
      avisoLogin("Não foi possível validar o acesso agora (" + (e && e.message ? e.message : "erro de rede") + ").", login);
    }
  }

  function casa(txt) { return !filtro || String(txt).toUpperCase().indexOf(filtro.toUpperCase()) >= 0; }
  function textoLinha(r) { return [r.Title, r.CodOS, nomeGer(r.CodGerente, r.Gerente), nomeSup(r.CodSuperintendente, r.Superintendente), r.Negocio, r.Classificacao, r.ClassificacaoAdicional, r.Descricao, r.Cliente, r.Nome].join(" "); }

  function htmlMetas() {
    if (carregando) return '<div class="vazio">Carregando metas de ' + ANO + "...</div>";
    if (erroCarga) return '<div class="aviso erro"><h3>Metas indisponíveis</h3><p>' + esc(erroCarga) + '</p></div><button type="button" class="btn" data-acao="recarregar">Tentar de novo</button>';

    return '<div id="topoMetas">' + htmlTopo(edita) + "</div>" + htmlEmpresa(edita) + htmlSupers(edita) + htmlLocacoes(edita) + htmlOutrosGerentes(edita) + htmlOS(edita);
  }

  function htmlTopo(edita) {
    var h = "";
    var itensOS = montarOS();
    var semMeta = itensOS.filter(function (x) { return x.ctt && !(x.r.FatMeta > 0); });
    var viol = itensOS.filter(function (x) { return x.ctt && violacao(x.ctt); });
    var comOS = gerentesComOS();
    var gerSemMeta = Object.keys(comOS).filter(function (g) {
      return SUPER_OPERACIONAIS.indexOf(supDoGerente(g)) >= 0 && !linhas.some(function (r) { return r.Nivel === "GERENTE" && r.CodGerente === g && ativa(r) && r.FatMeta > 0; });
    }).sort(porNomeGer);
    if (!TEM_CTT) h += '<div class="aviso info"><h3>Sem dados da CTT</h3><p>A página foi aberta fora do Power BI: OSs vigentes, nomes e avisos dependem da CTT enviada pelo relatório.</p></div>';
    if (semMeta.length) {

        "<p>Estão ativas na CTT e ainda não têm faturamento e resultado definidos." + (edita ? " Clique no código para preencher." : "") + '</p><div class="codigos">' +
        semMeta.map(function (x) { return '<button type="button" data-ir="os:' + esc(x.ctt.cod) + '" title="' + esc(x.ctt.desc) + '">' + esc(x.ctt.cod) + "</button>"; }).join("") + "</div></div>";
    }
    if (gerSemMeta.length) {
      h += '<div class="aviso warn"><h3>' + gerSemMeta.length + (gerSemMeta.length === 1 ? " gerente com OS vigente está" : " gerentes com OS vigente estão") + " sem meta de " + ANO + "</h3>" +
        '<p>Têm OS ativa na CTT e nenhuma meta de gerente cadastrada.</p><div class="codigos">' +
        gerSemMeta.map(function (g) { return '<button type="button" data-ir="cx-G-' + esc(g) + '">' + esc(nomeGer(g)) + "</button>"; }).join("") + "</div></div>";
    }
    if (viol.length) {
      h += '<div class="aviso erro"><h3>' + viol.length + (viol.length === 1 ? " OS com status e estágio fora da regra" : " OSs com status e estágio fora da regra") + " na CTT</h3>" +
        '<p>ATIVO só com estágio EXECUCAO, DEMOBILIZACAO ou NOVA; ATUAL sempre FINALIZADA. Corrigir na CTT.</p><div class="codigos">' +
        viol.map(function (x) { return '<button type="button" data-ir="os:' + esc(x.ctt.cod) + '">' + esc(x.ctt.cod + " · " + violacao(x.ctt)) + "</button>"; }).join("") + "</div></div>";
    }

    var pend = pendencias();
    h += '<div class="barra"><input type="search" id="filtro" placeholder="Filtrar por nome, OS, negócio ou descrição" value="' + esc(filtro) + '" aria-label="Filtrar">';
    h += '<span class="status ' + corStatus + '" role="status">' + esc(msgStatus) + "</span>";
    h += '<div class="dir">' + (edita
      ? (pend.novas + pend.alteradas ? '<span class="chip sem">' + (pend.novas + pend.alteradas) + ((pend.novas + pend.alteradas) === 1 ? " alteração não gravada" : " alterações não gravadas") + "</span>" : "") +
        (pend.ctt ? '<span class="chip sync" title="Nome, superintendente, negócio ou classificação mudaram na CTT; a lista acompanha ao salvar">' + pend.ctt + (pend.ctt === 1 ? " linha com CTT atualizada" : " linhas com CTT atualizada") + "</span>" : "") +
        (pend.total ? "" : '<span class="chip def">tudo gravado</span>') +
        '<button type="button" class="btn sec" data-acao="recarregar"' + (gravando ? " disabled" : "") + ">Recarregar</button>" +
        '<button type="button" class="btn ok" data-acao="salvar"' + (pend.total && !gravando ? "" : " disabled") + ">" + (gravando ? "Gravando..." : "Salvar alterações") + "</button>"
      : '<span class="chip fora">Consulta · só o proprietário altera metas</span><button type="button" class="btn sec" data-acao="recarregar">Recarregar</button>') + "</div></div>";
    if (confirmando) {
      h += '<div class="confirma"><b>Gravar ' + pend.total + (pend.total === 1 ? " linha" : " linhas") + " na META_FINANCEIRA?</b><span>" +
        [pend.novas ? pend.novas + " nova(s)" : "", pend.alteradas ? pend.alteradas + " alterada(s)" : "", pend.ctt ? pend.ctt + " atualizada(s) pela CTT" : ""].filter(Boolean).join(" · ") +
        '</span><button type="button" class="btn ok" data-acao="confirmarSalvar">Gravar</button><button type="button" class="btn sec" data-acao="cancelarSalvar">Cancelar</button></div>';
    }
    return h;
  }

  // ---- tabela de linhas de meta (Empresa, Superintendente, Gerente, Locacoes)
  function tabelaMeta(rs, edita, vazio, todas) {
    var vis = todas ? rs : rs.filter(function (r) { return casa(textoLinha(r)); });
    if (!vis.length) return '<div class="vazio">' + (rs.length ? "Nenhuma linha no filtro." : vazio) + "</div>";
    return '<div class="rolagem"><table><thead><tr><th>Negócio</th><th>Classificação</th><th>Classif. adicional</th><th>Descrição</th>' +
      '<th class="n">Faturamento (R$ mi)</th><th class="n">Resultado (R$ mi)</th><th class="n">% Margem</th>' + (edita ? "<th></th>" : "") + "</tr></thead><tbody>" +
      vis.map(function (r) {
        return "<tr" + atributosLinha(r) + ">" + combo(r, "Negocio", edita) + combo(r, "Classificacao", edita) +
          texto(r, "ClassificacaoAdicional", edita, "Classificação adicional") + texto(r, "Descricao", edita, "Descrição") +
          numero(r, "FatMeta", edita, "Faturamento", false) + numero(r, "ResMeta", edita, "Resultado", r.EntradaPor === "MARGEM") +
          numero(r, "MargemMeta", edita, "Margem", r.EntradaPor !== "MARGEM") + (edita ? botaoRemover(r) : "") + "</tr>";
      }).join("") + "</tbody></table></div>";
  }
  function atributosLinha(r, extra) {
    var cls = [];
    if (!r.id && !r._virtual) cls.push("novo");
    if (r.Ativo === "Nao") cls.push("desativada");
    if (extra) cls.push(extra);
    return ' data-uid="' + r.uid + '"' + (cls.length ? ' class="' + cls.join(" ") + '"' : "") + (r.Ativo === "Nao" ? ' title="Será desativada ao salvar; clique no × de novo para manter"' : "");
  }
  function botaoRemover(r) {
    return '<td><button type="button" class="x" data-remover="' + r.uid + '" title="' + (r.id ? "Desativar esta meta" : "Descartar linha nova") + '" aria-label="Remover linha">×</button></td>';
  }
  function botaoNovo(nivel, cod, rotulo) {
    return '<button type="button" class="btn peq" data-novo="' + nivel + '"' + (cod ? ' data-cod="' + esc(cod) + '"' : "") + ">" + (rotulo || "+ Adicionar linha") + "</button>";
  }

  function htmlEmpresa(edita) {
    var rs = linhas.filter(function (r) { return r.Nivel === "EMPRESA"; });
    if (filtro && !casa("EMPRESA") && !rs.some(function (r) { return casa(textoLinha(r)); })) return "";
    var itens = itensBlocoOS(), porNeg = {};
    itens.forEach(function (x) { var n = x.ctt ? x.ctt.negocio : x.r.Negocio; if (!n || !ativa(x.r)) return; porNeg[n] = porNeg[n] || { f: 0, r: 0 }; porNeg[n].f += x.r.FatMeta || 0; porNeg[n].r += x.r.ResMeta || 0; });
    linhas.forEach(function (r) { if (r.Nivel === "NEGOCIO" && ativa(r) && r.Negocio) { porNeg[r.Negocio] = porNeg[r.Negocio] || { f: 0, r: 0 }; porNeg[r.Negocio].f += r.FatMeta || 0; porNeg[r.Negocio].r += r.ResMeta || 0; } });
    var conf = Object.keys(porNeg).sort().map(function (n) { return n + " " + fmtMi(porNeg[n].f) + " / " + fmtMi(porNeg[n].r); }).join(" · ");
    return '<section class="caixa" id="cx-E"><div class="caixa-topo"><h2>Empresa</h2><span class="dica">Meta da diretoria por negócio</span>' + htmlTotal("E") +
      '<span class="dir">' + (edita ? botaoNovo("EMPRESA") : "") + "</span></div>" +
      tabelaMeta(rs, edita, "Nenhuma meta da empresa.", casa("EMPRESA")) +
      (conf ? '<div class="conferencia">Conferência · soma das OSs, prospecções e Locações por negócio: ' + esc(conf) + "</div>" : "") + "</section>";
  }

  function htmlSupers(edita) {

  function htmlOS(edita) {

  function chipsItem(x) {

  function combo(r, campo, edita) {

  // ===========================================================================
  // Lista suspensa propria: a nativa abre deslocada dentro do visual do Power BI (o relatorio

  // ===========================================================================
  var comboAtual = null;
  function abrirCombo(btn) {

    var tr = btn.closest("tr[data-uid]"), r = tr && porUid(tr.getAttribute("data-uid"));
    if (!r) return;
    var campo = btn.getAttribute("data-combo"), ops = opcoesCampo(campo);
    var fl = document.getElementById("flutuante");

    var atual = ops.map(function (o) { return o[0]; }).indexOf(r[campo] || "");
    comboAtual.ativo = atual < 0 ? 0 : atual;
    fl.innerHTML = (ops.length > 8 ? '<input class="filtro-combo" type="text" placeholder="Digite para filtrar" aria-label="Filtrar opções">' : "") + '<div class="opcoes" role="listbox"></div>';
    desenharOpcoes();

    fl.style.minWidth = Math.max(rect.width, 180) + "px";
    fl.style.left = (rect.left + window.pageXOffset) + "px";
    fl.style.top = (rect.bottom + window.pageYOffset + 3) + "px";
    fl.hidden = false;
    var larg = fl.offsetWidth, maxLeft = document.documentElement.clientWidth + window.pageXOffset - larg - 8;
    if (rect.left + window.pageXOffset > maxLeft) fl.style.left = Math.max(8, maxLeft) + "px";

  function desenharOpcoes() {
    var c = comboAtual; if (!c) return;
    var fl = document.getElementById("flutuante");
    c.vis = c.ops.filter(function (o) { return !c.filtro || o[1].toUpperCase().indexOf(c.filtro.toUpperCase()) >= 0; });
    if (c.ativo >= c.vis.length) c.ativo = c.vis.length - 1;
    if (c.ativo < 0) c.ativo = 0;
    var val = c.r[c.campo] || "";
    fl.querySelector(".opcoes").innerHTML = c.vis.length ? c.vis.map(function (o, i) {
      return '<div role="option" class="opcao' + (i === c.ativo ? " ativa" : "") + (o[0] === val ? " atual" : "") + '" data-i="' + i + '" aria-selected="' + (o[0] === val) + '">' + esc(o[1]) + "</div>";
    }).join("") : '<div class="opcao">Nada encontrado</div>';

  function fecharCombo(devolverFoco) {

    comboAtual = null;

  function escolherOpcao(i) {
    var c = comboAtual; if (!c || !c.vis[i]) return;
    var v = c.vis[i][0], r = c.r, campo = c.campo, uid = r.uid;

  // ===========================================================================
  // Edicao
  // ===========================================================================
  function porUid(uid) { return linhas.filter(function (r) { return r.uid === uid; })[0]; }
  function recalcular(r) {
    if (!r.FatMeta) { if (r.EntradaPor !== "MARGEM") r.MargemMeta = null; return; }
    if (r.EntradaPor === "MARGEM") { if (r.MargemMeta != null) r.ResMeta = Math.round(r.FatMeta * r.MargemMeta * 100) / 100; }
    else if (r.ResMeta != null) r.MargemMeta = Math.round(r.ResMeta / r.FatMeta * 1e6) / 1e6;
    else r.MargemMeta = null;
  }
  function editar(el) {
    var tr = el.closest("tr[data-uid]");
    if (!tr) return;
    var r = porUid(tr.getAttribute("data-uid"));
    if (!r) return;
    var campo = el.getAttribute("data-f");
    msgStatus = ""; corStatus = "";
    if (campo === "FatMeta" || campo === "ResMeta" || campo === "MargemMeta") {
      var n = lerNumero(el.value);
      if (isNaN(n)) { msgStatus = "Valor inválido: use números, por exemplo 12,5"; corStatus = "erro"; atualizarNoLugar(tr, r); return; }
      if (campo === "MargemMeta") { r.MargemMeta = n == null ? null : n / 100; r.EntradaPor = "MARGEM"; }
      else if (campo === "ResMeta") { r.ResMeta = n == null ? null : n * 1e6; r.EntradaPor = "RESULTADO"; }
      else r.FatMeta = n == null ? null : n * 1e6;
      if (!r.EntradaPor) r.EntradaPor = "RESULTADO";
      recalcular(r);
    } else {
      r[campo] = semAcento(el.value).toUpperCase().trim();
    }
    atualizarNoLugar(tr, r);
  }
  // Atualiza so a linha, os totais e o topo: redesenhar tudo tirava o foco do campo seguinte.
  function atualizarNoLugar(tr, r) {
    tr.querySelectorAll("input[data-f]").forEach(function (i) {
      var c = i.getAttribute("data-f"), numerico = c === "FatMeta" || c === "ResMeta" || c === "MargemMeta";
      if (numerico) i.value = c === "MargemMeta" ? fmtPct(r[c]) : fmtMi(r[c]);
      else i.value = r[c] || "";
      if (numerico) i.classList.toggle("calc", (c === "ResMeta" && r.EntradaPor === "MARGEM") || (c === "MargemMeta" && r.EntradaPor !== "MARGEM"));
      i.classList.toggle("alterado", numerico ? alterado(r, c) : !!(r.id && alterado(r, c)));
    });
    var sit = tr.querySelector("td.sit");
    if (sit) { var x = itensBlocoOS().filter(function (y) { return y.r.uid === r.uid; })[0]; if (x) sit.innerHTML = chipsItem(x); }
    atualizarTotais();
    var topo = document.getElementById("topoMetas");
    if (topo) topo.innerHTML = htmlTopo(ehProprietario());
  }
  function novaLinha(nivel, cod) {
    var r = linhaVazia(nivel);
    if (nivel === "SUPERINTENDENTE") { r.CodSuperintendente = cod; r.Superintendente = nomeSup(cod); }
    if (nivel === "GERENTE") { r.CodGerente = cod; r.Gerente = nomeGer(cod); r.CodSuperintendente = supDoGerente(cod); r.Superintendente = nomeSup(r.CodSuperintendente); }
    if (nivel === "PROSPECCAO") r.Classificacao = "PROSPECCAO";

    render();
    var tr = document.querySelector('tr[data-uid="' + r.uid + '"]');

  }
  function remover(uid) {
    var r = porUid(uid);
    if (!r) return;
    if (!r.id) linhas = linhas.filter(function (x) { return x.uid !== uid; });
    else r.Ativo = r.Ativo === "Nao" ? "Sim" : "Nao";
    render();

  // ===========================================================================
  // Gravacao
  // ===========================================================================
  function pendencias() {
    var novas = 0, alteradas = 0, ctt = 0, lista = [];
    linhas.forEach(function (r) {
      if (r.Nivel === "OS") return;
      if (!r.id) { novas++; lista.push({ r: r }); }
      else if (linhaAlterada(r)) { alteradas++; lista.push({ r: r }); }
      else if (divergeCTTLinha(r)) { ctt++; lista.push({ r: r }); }
    });
    montarOS().forEach(function (x) {
      var r = x.r, mudouValor = ["FatMeta", "ResMeta", "MargemMeta", "EntradaPor"].some(function (c) { return alterado(r, c); });
      if (!r.id) { if (r.FatMeta != null || r.ResMeta != null) { novas++; lista.push(x); } return; }
      if (mudouValor) { alteradas++; lista.push(x); }
      else if (divergenciasCTT(x).length) { ctt++; lista.push(x); }
    });
    return { novas: novas, alteradas: alteradas, ctt: ctt, total: novas + alteradas + ctt, lista: lista };
  }
  function proximaChave(prefixo) {
    var max = 0;
    linhas.forEach(function (r) {
      if (r.Title && r.Title.indexOf(prefixo + "|") === 0) { var n = parseInt(r.Title.slice(prefixo.length + 1), 10); if (n > max) max = n; }
    });
    return prefixo + "|" + ("000" + (max + 1)).slice(-3);
  }
  function validar(lista) {
    for (var i = 0; i < lista.length; i++) {
      var r = lista[i].r;
      if (r.Nivel === "OS" || r.Ativo === "Nao") continue;
      if (r.Nivel === "EMPRESA" && !r.Negocio) return "Toda linha da Empresa precisa de negócio.";
      if (r.Nivel === "PROSPECCAO" && (!r.CodGerente || !r.Negocio)) return "Toda prospecção precisa de gerente e negócio.";
      if (r.Nivel === "PROSPECCAO" && !r.Cliente) return "Informe o cliente da prospecção.";
    }
    return "";
  }
  function payload(x) {
    var r = x.r, campos = {};
    if (x.ctt) aplicarCTT(x); else aplicarCTTLinha(r);
    if (!r.id) {
      if (r.Nivel === "OS") r.Title = ANO + "|OS|" + r.CodOS;
      else if (r.Nivel === "EMPRESA") r.Title = proximaChave(ANO + "|EMPRESA");
      else if (r.Nivel === "PROSPECCAO") r.Title = proximaChave(ANO + "|PROSPECCAO");
      else if (r.Nivel === "SUPERINTENDENTE") r.Title = proximaChave(ANO + "|SUPERINTENDENTE|" + r.CodSuperintendente);
      else if (r.Nivel === "GERENTE") r.Title = proximaChave(ANO + "|GERENTE|" + r.CodGerente);
      else r.Title = proximaChave(ANO + "|" + r.Nivel);
      campos.Title = r.Title; campos.Ano = ANO; campos.Nivel = r.Nivel; campos.CodOS = r.CodOS || "";
      campos.Situacao = "RASCUNHO"; campos.Origem = "APP";
    }
    ["CodGerente", "Gerente", "CodSuperintendente", "Superintendente", "Negocio", "Classificacao", "EntradaPor", "Ativo"].forEach(function (c) { campos[c] = r[c] || ""; });
    if (r.Nivel !== "OS") ["ClassificacaoAdicional", "Descricao", "Cliente"].forEach(function (c) { campos[c] = r[c] || ""; });
    campos.FatMeta = r.FatMeta; campos.ResMeta = r.ResMeta; campos.MargemMeta = r.MargemMeta;
    campos.AtualizadoPor = sessao.login; campos.AtualizadoEm = new Date().toISOString();
    return { id: r.id, campos: campos };
  }
  async function salvar() {
    var p = pendencias();
    var erro = validar(p.lista);
    confirmando = false;
    if (erro) { msgStatus = erro; corStatus = "erro"; render(); return; }
    gravando = true; msgStatus = "Gravando " + p.total + (p.total === 1 ? " linha..." : " linhas..."); corStatus = ""; render();
    var itens = p.lista.map(payload), falha = "";
    try {
      for (var i = 0; i < itens.length; i += LOTE) {
        var res = await postar(FLOW.gravar, { login: sessao.login, hash: sessao.hash, itens: itens.slice(i, i + LOTE) });
        if (res.status !== 200) {
          falha = res.status === 403 ? "Somente o proprietário pode gravar metas." : "Falha ao gravar no SharePoint (HTTP " + res.status + "). " + (i ? i + " linhas já tinham sido gravadas." : "Nada foi gravado.");
          break;
        }
      }
    } catch (e) { falha = "Falha de conexão ao gravar."; }
    gravando = false;
    await carregar();
    msgStatus = falha || ("Gravado: " + itens.length + (itens.length === 1 ? " linha." : " linhas."));
    corStatus = falha ? "erro" : "ok";
    render();
  }

  // ===========================================================================
  // Eventos (delegados: a tela e redesenhada a cada mudanca de estrutura)
  // ===========================================================================
  document.addEventListener("click", function (ev) {
    var op = ev.target.closest(".opcao[data-i]");
    if (op && comboAtual) { escolherOpcao(parseInt(op.getAttribute("data-i"), 10)); return; }
    if (comboAtual && !ev.target.closest("#flutuante") && ev.target.closest("[data-combo]") !== comboAtual.btn) fecharCombo();
    var t = ev.target.closest("button");
    if (!t) return;
    if (t.hasAttribute("data-combo")) { if (comboAtual && comboAtual.btn === t) fecharCombo(); else abrirCombo(t); return; }
    if (t.hasAttribute("data-aba")) { abaAtiva = t.getAttribute("data-aba"); render(); return; }
    if (t.hasAttribute("data-ir")) { filtro = ""; focoAlvo = t.getAttribute("data-ir"); render(); return; }
    if (t.hasAttribute("data-novo")) { novaLinha(t.getAttribute("data-novo"), t.getAttribute("data-cod") || ""); return; }
    if (t.hasAttribute("data-remover")) { remover(t.getAttribute("data-remover")); return; }
    var a = t.getAttribute("data-acao");
    if (a === "sair") { sessao = null; gravarSessao(null); linhas = []; erroCarga = ""; render(); }
    else if (a === "recarregar") { msgStatus = ""; carregar(); }
    else if (a === "salvar") { confirmando = true; render(); }
    else if (a === "cancelarSalvar") { confirmando = false; render(); }
    else if (a === "confirmarSalvar") salvar();
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.matches("#painel input[data-f]")) editar(ev.target);
  });
  document.addEventListener("keydown", function (ev) {
    if (comboAtual) {
      var c = comboAtual;
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();
        c.ativo += ev.key === "ArrowDown" ? 1 : -1;
        desenharOpcoes();
        var a = document.querySelector("#flutuante .opcao.ativa"); if (a) a.scrollIntoView({ block: "nearest" });
        return;
      }
      if (ev.key === "Enter") { ev.preventDefault(); escolherOpcao(c.ativo); return; }
      if (ev.key === "Escape") { ev.preventDefault(); fecharCombo(true); return; }
      if (ev.key === "Tab") { fecharCombo(); return; }
    } else if ((ev.key === "ArrowDown" || ev.key === " ") && ev.target.matches && ev.target.matches("[data-combo]")) {
      ev.preventDefault(); abrirCombo(ev.target); return;
    }
    if (ev.key === "Enter" && ev.target.matches("#painel input[data-f]")) { ev.preventDefault(); ev.target.blur(); }
  });
  var tFiltro = null;
  document.addEventListener("input", function (ev) {
    if (ev.target.classList && ev.target.classList.contains("filtro-combo") && comboAtual) {
      comboAtual.filtro = ev.target.value; comboAtual.ativo = 0; desenharOpcoes(); return;
    }
    if (ev.target.id !== "filtro") return;
    clearTimeout(tFiltro);
    tFiltro = setTimeout(function () {
      filtro = ev.target.value;
      var pos = ev.target.selectionStart;
      render();
      var f = document.getElementById("filtro");
      if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (e) {} }
    }, 250);
  });
  window.addEventListener("resize", function () { fecharCombo(); });

  // ===========================================================================
  sessao = lerSessao();
  render();
  if (sessao) carregar();
})();
</script>
</body>
</html>
