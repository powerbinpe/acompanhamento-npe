<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPCO · Destaques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0b1a3a;
    --bg-bar: #10244d;
    --bg-card: #ffffff;
    --bg-soft: #f1f5f9;
    --bg-sub: #f8fafc;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --accent-soft: #eff6ff;
    --ok: #16a34a;
    --warn-bg: #fef3c7;
    --danger: #b91c1c;
    --danger-bg: #fee2e2;
    --text: #0f172a;
    --muted: #475569;
    --line: #cbd5e1;
    --line-soft: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Fontes 50% maiores que a primeira versao (pedido de 16/09): rem passa a valer 24px */
  html { font-size: 24px; }
  body { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; background: var(--bg-main); color: var(--text); font-size: 21px; position: relative; }
  button, input { font-family: inherit; font-size: inherit; }
  .app { padding: 16px 20px 40px; }

  .topo { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--bg-bar); border: 1px solid #1e3a70; border-radius: 12px; padding: 12px 18px; color: #e2e8f0; }
  .marca { font-weight: 800; font-size: 1.15rem; letter-spacing: .02em; color: #fff; }
  .marca span { font-weight: 600; font-size: .85rem; color: #93c5fd; margin-left: 10px; letter-spacing: .06em; }
  .sessao { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .85rem; }
  .pill { background: #1d4ed8; color: #fff; border-radius: 999px; padding: 3px 10px; font-weight: 800; font-size: .72rem; letter-spacing: .06em; }
  .pill.prop { background: #047857; }
  .btn { border: none; border-radius: 8px; padding: 8px 14px; font-weight: 800; cursor: pointer; background: var(--accent); color: #fff; white-space: nowrap; }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.sec { background: #e2e8f0; color: #334155; }
  .btn.sec:hover { background: #cbd5e1; }
  .btn.ok { background: var(--ok); }
  .btn.peq { padding: 4px 10px; font-size: .74rem; }
  .btn.abre { background: #fff; color: #1e3a8a; border: 1.5px solid #93c5fd; }
  .btn.abre:hover { background: var(--accent-soft); }
  .btn:focus-visible, input:focus-visible, .combo:focus-visible { outline: 3px solid #93c5fd; outline-offset: 1px; }

  .abas { display: flex; gap: 6px; margin: 14px 0 0; flex-wrap: wrap; }
  .aba { background: transparent; color: #cbd5e1; border: 1px solid #1e3a70; border-bottom: none; border-radius: 10px 10px 0 0; padding: 10px 18px; font-weight: 700; cursor: pointer; }
  .aba.on { background: var(--bg-card); color: var(--text); border-color: var(--bg-card); }
  .painel { background: var(--bg-card); border-radius: 0 12px 12px 12px; padding: 20px; min-height: 400px; }

  .aviso { border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .aviso h3 { font-size: 1rem; margin-bottom: 4px; }
  .aviso p { color: var(--muted); font-size: .86rem; }
  .aviso.warn { background: var(--warn-bg); border: 1px solid #fcd34d; }
  .aviso.warn h3 { color: #92400e; }
  .aviso.erro { background: var(--danger-bg); border: 1px solid #fecaca; }
  .aviso.erro h3 { color: #991b1b; }
  .aviso.info { background: var(--accent-soft); border: 1px solid #bfdbfe; }
  .aviso.info h3 { color: #1e3a8a; }
  .codigos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .codigos button { border: 1px solid #fcd34d; background: #fff; border-radius: 6px; padding: 4px 9px; font-size: .78rem; font-weight: 700; cursor: pointer; color: #78350f; text-align: left; }
  .codigos button.on { background: #92400e; color: #fff; border-color: #92400e; }

  .rapido { border: 2px solid #f59e0b; border-radius: 10px; margin: -6px 0 16px; background: #fffbeb; }
  .rapido-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px 0; }
  .rapido-topo h4 { font-size: .9rem; }
  .rapido-topo .dir { margin-left: auto; display: flex; gap: 8px; }
  .rapido table td { border-bottom: none; }

  .login { max-width: 560px; margin: 40px auto; border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  .login h2 { font-size: 1.1rem; margin-bottom: 4px; }
  .login p { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .login label { display: block; font-size: .74rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 4px; }
  .login input { width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 8px; }
  .login .btn { width: 100%; margin-top: 16px; padding: 10px; }

  .barra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .barra input[type=search] { flex: 1 1 260px; max-width: 420px; padding: 8px 11px; border: 1.5px solid var(--line); border-radius: 8px; }
  .barra .status { font-size: .84rem; font-weight: 700; color: var(--muted); }
  .barra .status.ok { color: var(--ok); }
  .barra .status.erro { color: var(--danger); }
  .barra .dir { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .confirma { background: var(--accent-soft); border: 1px solid #93c5fd; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  .grupo-titulo { display: flex; align-items: center; gap: 12px; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
  .grupo-titulo .dir { margin-left: auto; display: flex; gap: 8px; letter-spacing: 0; text-transform: none; }
  .caixa { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; background: #fff; overflow: hidden; }
  .caixa-topo { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
  .caixa-topo h3 { font-size: 1rem; }
  .caixa-topo .dir { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .papel { font-size: .66rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: 8px; }
  .dica { color: var(--muted); font-size: .8rem; font-weight: 400; }
  .nota { color: var(--muted); font-size: .74rem; font-style: italic; font-weight: 400; margin-left: 8px; }
  .dif { font-weight: 800; margin-left: 8px; }
  .dif.ok { color: var(--ok); }
  .dif.alerta { color: #b45309; }

  /* Grade unica: toda tabela de meta usa as mesmas larguras, entao os valores de empresa,
     superintendentes e gerentes ficam alinhados na mesma coluna em qualquer caixa. */
  .rolagem { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  table.grade { table-layout: fixed; min-width: 1620px; }
  col.c-neg, col.c-cls { width: 250px; }
  col.c-adic { width: 280px; }
  col.c-num { width: 250px; }
  col.c-pct { width: 160px; }
  col.c-x { width: 56px; }
  th { text-align: left; font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 10px; white-space: nowrap; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  th.n, td.n { text-align: right; }
  td.n { font-variant-numeric: tabular-nums; }
  tr.cab th { font-size: .95rem; letter-spacing: 0; text-transform: none; color: var(--text); padding: 12px 10px 10px 14px; background: var(--bg-soft); border-top: 1px solid var(--line); white-space: normal; }
  tr.cab th.n { padding-right: 10px; }
  tr.cab .dir { float: right; display: flex; gap: 8px; }
  tr.cab .val { display: inline-block; min-width: 100%; background: var(--accent-soft); border: 1px solid #bfdbfe; border-radius: 6px; padding: 4px 8px; font-size: .95rem; font-weight: 800; color: #0f172a; font-variant-numeric: tabular-nums; text-align: right; }
  table.sub tr.cab th { background: var(--bg-sub); font-size: .88rem; padding-left: 40px; }
  table.sub tr.cab th.n { padding-left: 10px; }
  tr.ref td { font-size: .76rem; color: var(--muted); background: #fff; padding: 5px 10px; }
  tr.ref td:first-child { padding-left: 14px; }
  table.sub tr.ref td:first-child { padding-left: 40px; }
  tr.ref .val { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  tr.ref.soma td { font-weight: 800; color: var(--text); border-top: 1px dashed var(--line); }
  tr.ref.soma .val { color: var(--text); }
  tr.secao td { font-size: .66rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--bg-sub); padding: 6px 10px 6px 40px; }
  tr.titulos th { border-bottom: 1px solid var(--line-soft); background: #fff; }
  tr.agreg td { color: var(--muted); }
  tr.pend td { background: #fffbeb; }
  tr.foco td { background: #dbeafe !important; }
  tr.novo td { background: #f0fdf4; }
  tr.desativada td { opacity: .45; text-decoration: line-through; }
  tr.grupo-linha td { background: var(--bg-soft); border-top: 2px solid var(--line); padding: 8px 10px; }
  tr.grupo-linha b { font-size: .86rem; }
  textarea.obs-geral { width: 100%; box-sizing: border-box; font: inherit; line-height: 1.5; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-card); color: inherit; resize: vertical; }
  .obs-geral.leitura { white-space: pre-wrap; line-height: 1.5; }
  tr.obs td { background: var(--danger-bg); color: #991b1b; font-size: .78rem; font-weight: 700; padding: 6px 10px 8px 20px; }
  td input.v { width: 100%; text-align: right; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums; }
  td input.v.calc { background: var(--bg-soft); color: var(--muted); }
  td input.t { width: 100%; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 6px; }
  td input.t + input.t { margin-top: 4px; }
  td input.alterado, .combo.alterado { border-color: #f59e0b; }
  .combo { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 7px 11px; border: 1.5px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); cursor: pointer; text-align: left; }
  .combo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .combo i { font-style: normal; color: var(--muted); font-size: .7rem; }
  .combo.vazio span { color: #94a3b8; }
  .flutuante { position: absolute; z-index: 50; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(15, 23, 42, .22); max-height: 450px; overflow-y: auto; padding: 6px; }
  .flutuante .filtro-combo { width: 100%; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 6px; margin-bottom: 4px; }
  .opcao { padding: 9px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: .84rem; }
  .opcao.ativa { background: #dbeafe; }
  .opcao.atual { font-weight: 800; }
  .os { font-weight: 700; }
  .chip { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: .7rem; font-weight: 800; white-space: nowrap; margin: 1px 2px 1px 0; }
  .chip.sem { background: var(--warn-bg); color: #92400e; }
  .chip.def { background: #dcfce7; color: #166534; }
  .chip.fora { background: #e2e8f0; color: #334155; }
  .chip.viol { background: var(--danger-bg); color: #991b1b; }
  .chip.sync { background: #dbeafe; color: #1e40af; }
  .vazio { color: var(--muted); padding: 10px 14px; font-size: .82rem; }
  .x { background: none; border: none; color: #94a3b8; font-weight: 800; cursor: pointer; font-size: 1rem; padding: 0 4px; }
  .x:hover { color: var(--danger); }
  .construcao { padding: 60px 20px; text-align: center; color: var(--muted); }
  .construcao h2 { color: var(--text); margin-bottom: 6px; }
  .diag { margin-top: 12px; font-size: .7rem; color: #64748b; }
  .seta { border: 1px solid var(--line); background: #fff; color: #1e3a8a; border-radius: 6px; min-width: 1.6rem; height: 1.6rem; margin-right: 10px; cursor: pointer; font-size: .8rem; line-height: 1; vertical-align: middle; }
  .seta:hover { background: var(--accent-soft); }
  tr.cab.nivel2 th { background: var(--bg-sub); font-size: .9rem; padding-left: 44px; border-top: 1px solid var(--line-soft); }
  tr.cab.nivel2 th.n { padding-left: 10px; }
  tr.grande td { font-size: .95rem; }
  tr.grande td input.v, tr.grande .combo { font-size: .95rem; padding: 9px 12px; }
  table.arvore { table-layout: fixed; min-width: 1700px; }
  table.arvore th.grupo-col { text-align: center; border-bottom: 1px solid var(--line-soft); }
  tr.no td { font-weight: 700; }
  tr.no.nivel1 td { background: var(--bg-soft); border-top: 2px solid var(--line); font-size: .95rem; padding-left: 12px; }
  tr.no.nivel2 td { background: var(--bg-sub); }
  tr.no.nivel2 td:first-child { padding-left: 44px; }
  tr.no.nivel3 td:first-child { padding-left: 76px; }
  tr.folha td:first-child, tr.obs td { padding-left: 116px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="topo">
    <div class="marca">NPE<span id="subtitulo">RPCO</span></div>
    <div class="sessao" id="sessao"></div>
  </div>
  <div class="abas" role="tablist" id="abas"></div>
  <div class="painel" id="painel"></div>
  <div class="diag" id="diag"></div>
</div>
<div id="flutuante" class="flutuante" hidden></div>

<script>
(function () {
  "use strict";

  // ===========================================================================
  // Fluxos (Power Automate). Ler e Gravar conferem login + hash na PARAM_ACESSO:
  // ler exige Master ativo, gravar exige o PROPRIETARIO.
  // ===========================================================================
  var FLOW = {
    login:  "https://defaultdff5d80f6e7141999a3fbf5dc8891d.18.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/bcf1295963df418f91a48dd71ea02e60/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=VfbYQC2H12f_6GZCSMmrctJBKF1B8ns4TalVByCO688",
    ler:    "https://defaultdff5d80f6e7141999a3fbf5dc8891d.18.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/a343fee6cc6345d681e0dd483dbb9d05/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=3nqkHSexMoJM-hcvhonWaF5vzaYENBy8ONwHhwyNEww",
    gravar: "https://defaultdff5d80f6e7141999a3fbf5dc8891d.18.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/03/workflows/f42b6d3d1a8f45588136d0ce70d2d2ab/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=npaAIzRXLDdrejvhShfxykRxpHqrX2iiPHH373XtEo8",
    // NPE-Ler-Metas (publico): traz o cadastro de Responsaveis do Acompanhamento de Performance
    metas:  "https://defaultdff5d80f6e7141999a3fbf5dc8891d.18.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/27/workflows/eee057e0905d4712aa0317bb0acd74c3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xDFTcuw4PksmljQDhYgPLtMDZtUeOWxXHojiUPzGCR0"
  };
  var ITERACOES = 200000;
  // Os unicos superintendentes operacionais (decisao do usuario, 15/09/2026). Os nomes vem da CTT.
  var SUPER_OPERACIONAIS = ["000096", "000070", "000238", "000117"];
  var ESTAGIOS = { E: "EXECUCAO", N: "NOVA", D: "DEMOBILIZACAO", F: "FINALIZADA", X: "" };
  var STATUS = { A: "ATIVO", U: "ATUAL", E: "ENCERRADO" };
  var LOTE = 20;

  // ===========================================================================
  // Dados da CTT, montados pela medida _mHTML_RPCO
  //   GER = codigo:nome:codigo do superintendente | SUP = codigo:nome
  //   OS  = codigo,OS DESCRICAO RELACIONADA (codificada),gerente,super,negocio(i),classificacao(i),status+estagio
  // ===========================================================================
  var P = new URLSearchParams(location.search);
  var ANO = parseInt(P.get("Ano"), 10) || new Date().getFullYear();
  var TEM_CTT = P.has("OS");
  function pad6(c) { c = String(c || "").trim(); return c && /^\d+$/.test(c) ? ("000000" + c).slice(-6) : c; }
  function lista(nome) { return String(P.get(nome) || "").split("|").filter(Boolean); }
  function decodificar(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
  var NEG = lista("NEG"), CLS = lista("CLS");
  var GER = {}, SUP = {};
  lista("GER").forEach(function (x) { var p = x.split(":"); if (p.length >= 2 && !GER[pad6(p[0])]) GER[pad6(p[0])] = { nome: p[1], sup: pad6(p[2] || "") }; });
  lista("SUP").forEach(function (x) { var i = x.indexOf(":"); if (i > 0) SUP[pad6(x.slice(0, i))] = x.slice(i + 1); });
  var OS_CTT = {};
  String(P.get("OS") || "").split(";").filter(Boolean).forEach(function (l) {
    var f = l.split(",");
    if (f.length < 7) return;
    var fl = f[6] || "";
    OS_CTT[f[0]] = {
      cod: f[0], desc: decodificar(f[1]), codGer: pad6(f[2]), codSup: pad6(f[3]),
      negocio: NEG[+f[4]] || "", classificacao: CLS[+f[5]] || "",
      status: STATUS[fl.charAt(0)] || fl.charAt(0),
      estagio: ESTAGIOS.hasOwnProperty(fl.charAt(1)) ? ESTAGIOS[fl.charAt(1)] : fl.charAt(1)
    };
  });
  // Regra da CTT: ATIVO so em EXECUCAO/DEMOBILIZACAO/NOVA; ATUAL e ENCERRADO sempre FINALIZADA.
  // A OS so sai do acompanhamento com ENCERRADO + FINALIZADA (essa nem chega aqui).
  function violacao(o) {
    if (o.status === "ATIVO" && ["EXECUCAO", "DEMOBILIZACAO", "NOVA"].indexOf(o.estagio) < 0) return "status ATIVO com estágio " + (o.estagio || "em branco");
    if ((o.status === "ATUAL" || o.status === "ENCERRADO") && o.estagio !== "FINALIZADA") return "status " + o.status + " com estágio " + (o.estagio || "em branco");
    return "";
  }

  // ===========================================================================
  // Sessao: dentro do visual do Power BI so o window.name atravessa a recarga do iframe.
  // Guarda o hash (nunca a senha) para ler/gravar sem pedir login a cada filtro; expira em 8 h.
  // ===========================================================================
  var PREFIXO = "NPERPCO1:";
  var sessao = null;
  function lerSessao() {
    try {
      if (String(window.name).indexOf(PREFIXO) === 0) {
        var s = JSON.parse(window.name.slice(PREFIXO.length));
        if (s && s.login && s.hash && Date.now() - s.ts < 8 * 3600 * 1000) return s;
      }
    } catch (e) {}
    return null;
  }
  function gravarSessao(s) { try { window.name = s ? PREFIXO + JSON.stringify(s) : ""; } catch (e) {} }
  function ehProprietario() { return !!sessao && sessao.perfil === "PROPRIETARIO"; }

  async function derivarHash(login, senha) {
    var enc = new TextEncoder();
    var chave = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(String(login).toLowerCase().trim()), iterations: ITERACOES, hash: "SHA-256" }, chave, 256);
    return Array.from(new Uint8Array(bits)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  async function postar(url, corpo) {
    var r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    var txt = await r.text();
    var json = null;
    try { json = txt ? JSON.parse(txt) : null; } catch (e) {}
    return { status: r.status, json: json };
  }

  // ===========================================================================
  // Estado
  // ===========================================================================
  var abaAtiva = "metas";
  var linhas = [];
  var carregando = false, erroCarga = "", filtro = "", msgStatus = "", corStatus = "";
  var confirmando = false, gravando = false, focoAlvo = "", rapidoOS = "";
  var abertos = {};   // superintendentes com os gerentes abertos
  var abertosG = {}, abertosOS = {};   // gerentes abertos; nos abertos da arvore de OS
  var RESP = [], RESP_OK = false;      // cadastro de Responsaveis (Tipo RESPONSAVEL)
  var seq = 0;

  var CAMPOS_TXT = ["Title", "Nivel", "CodOS", "CodGerente", "Gerente", "CodSuperintendente", "Superintendente", "Negocio", "Classificacao", "ClassificacaoAdicional", "Descricao", "Cliente", "Nome", "Justificativa", "EntradaPor", "Situacao", "Ativo", "Origem"];

  function aplicarCTTLinha(r) {

  // ===========================================================================

  // Login e leitura das metas saem juntos: a leitura ja confere o acesso, entao nao precisa

      if (!window.crypto || !crypto.subtle) { avisoLogin("Este navegador não permite validar a senha aqui (criptografia indisponível).", login); return; }
      var hash = await derivarHash(login, senha);

  function htmlRapido(edita) {
    if (!edita || !rapidoOS) return "";
    var x = montarOS().filter(function (y) { return y.ctt.cod === rapidoOS; })[0];
    if (!x) { rapidoOS = ""; return ""; }

      '<div class="rolagem"><table><thead><tr><th>Gerente</th><th>Superintendente</th><th>Negócio</th><th>Classificação</th><th class="n">Faturamento</th><th class="n">Resultado</th><th class="n">% Margem</th></tr></thead><tbody>' +
      "<tr" + atributosLinha(r) + "><td>" + esc(nomeGer(o.codGer)) + "</td><td>" + esc(nomeSup(o.codSup)) + "</td><td>" + esc(o.negocio) + "</td><td>" + esc(o.classificacao) + "</td>" +
      numero(r, "FatMeta", true, "Faturamento", false) + numero(r, "ResMeta", true, "Resultado", r.EntradaPor === "MARGEM") + numero(r, "MargemMeta", true, "Margem", r.EntradaPor !== "MARGEM") +
      "</tr></tbody></table></div></div>";
  }

  function htmlBarra(edita) {
    var h = "", pend = pendencias();

    h += '<div class="dir">' + (edita

        (pend.ctt ? '<span class="chip sync" title="Nome, superintendente, negócio ou classificação mudaram na CTT; a lista acompanha ao salvar">' + pend.ctt + (pend.ctt === 1 ? " linha com CTT atualizada" : " linhas com CTT atualizada") + "</span>" : "") +
        (pend.total ? "" : '<span class="chip def">tudo gravado</span>') +

    if (confirmando) {
      h += '<div class="confirma"><b>Gravar ' + pend.total + (pend.total === 1 ? " linha" : " linhas") + " na META_FINANCEIRA?</b><span>" +
        [pend.novas ? pend.novas + " nova(s)" : "", pend.alteradas ? pend.alteradas + " alterada(s)" : "", pend.ctt ? pend.ctt + " atualizada(s) pela CTT" : ""].filter(Boolean).join(" · ") +

  }

  // ---- grade comum
  var COLGROUP = '<colgroup><col class="c-neg"><col class="c-cls"><col class="c-adic"><col><col class="c-num"><col class="c-num"><col class="c-pct"><col class="c-x"></colgroup>';
  var TIT_VAL = '<th class="n">Faturamento</th><th class="n">Resultado</th><th class="n">% Margem</th><th></th>';
  var TITULOS = '<tr class="titulos"><th>Negócio</th><th>Classificação</th><th>Classif. adicional</th><th>Descrição</th>' + TIT_VAL + "</tr>";
  function cabecalho(nomeHtml, base, acoes) {
    return '<tr class="cab"><th colspan="4">' + nomeHtml + (acoes ? '<span class="dir">' + acoes + "</span>" : "") + "</th>" + celulasTotais(base) + "</tr>";
  }
  function linhaRef(rotuloHtml, base, extra, classe) {
    return '<tr class="ref' + (classe ? " " + classe : "") + '"><td colspan="4">' + rotuloHtml + (extra || "") + '</td><td class="n">' + celTotal(base, "f") + '</td><td class="n">' + celTotal(base, "r") + '</td><td class="n">' + celTotal(base, "p") + "</td><td></td></tr>";
  }
  function valoresLinha(r, edita) {
    return numero(r, "FatMeta", edita, "Faturamento", false) + numero(r, "ResMeta", edita, "Resultado", r.EntradaPor === "MARGEM") +
      numero(r, "MargemMeta", edita, "Margem", r.EntradaPor !== "MARGEM") + (edita ? botaoRemover(r) : "<td></td>");
  }
  function linhasMeta(rs, edita, vazio, todas) {
    var vis = todas ? rs : rs.filter(function (r) { return casa(textoLinha(r)); });
    if (!vis.length) return '<tr><td colspan="8" class="vazio">' + (rs.length ? "Nenhuma linha no filtro." : vazio) + "</td></tr>";
    return vis.map(function (r) {
      return "<tr" + atributosLinha(r) + ">" + combo(r, "Negocio", edita) + combo(r, "Classificacao", edita) +
        texto(r, "ClassificacaoAdicional", edita, "Classificação adicional") + texto(r, "Descricao", edita, "Descrição") + valoresLinha(r, edita) + "</tr>";
    }).join("");
  }
  function tabela(classe, conteudo) { return '<div class="rolagem"><table class="grade' + (classe ? " " + classe : "") + '">' + COLGROUP + conteudo + "</table></div>"; }
  function atributosLinha(r, extra) {
    var cls = [];
    if (!r.id && !r._virtual) cls.push("novo");
    if (r.Ativo === "Nao") cls.push("desativada");
    if (extra) cls.push(extra);
    return ' data-uid="' + r.uid + '"' + (cls.length ? ' class="' + cls.join(" ") + '"' : "") + (r.Ativo === "Nao" ? ' title="Será desativada ao salvar; clique no × de novo para manter"' : "");
  }
  function botaoRemover(r) {
    return '<td><button type="button" class="x" data-remover="' + r.uid + '" title="' + (r.id ? "Desativar esta meta" : "Descartar linha nova") + '" aria-label="Remover linha">×</button></td>';
  }
  function botaoNovo(nivelNovo, cod, rotulo) {
    return '<button type="button" class="btn peq" data-novo="' + nivelNovo + '"' + (cod ? ' data-cod="' + esc(cod) + '"' : "") + ">" + (rotulo || "+ Adicionar linha") + "</button>";
  }

  // ---- Empresa: por negocio (sem classificacao) e por classificacao (sem negocio)
  function linhasEmpresa(rs, edita, dim, todas) {
    var campo = dim === "N" ? "Negocio" : "Classificacao";
    var vis = todas ? rs : rs.filter(function (r) { return casa(textoLinha(r)); });
    if (!vis.length) return '<tr><td colspan="8" class="vazio">' + (rs.length ? "Nenhuma linha no filtro." : "Nenhuma meta cadastrada.") + "</td></tr>";
    return vis.map(function (r) { return "<tr" + atributosLinha(r, "grande") + ">" + combo(r, campo, edita, 4) + valoresLinha(r, edita) + "</tr>"; }).join("");
  }
  function htmlEmpresa(edita) {
    var rs = nivel("EMPRESA");
    var n = rs.filter(function (r) { return grupoEmpresa(r) === "N"; }), c = rs.filter(function (r) { return grupoEmpresa(r) === "C"; });
    var todas = casa("EMPRESA");
    if (filtro && !todas && !rs.some(function (r) { return casa(textoLinha(r)); })) return "";
    var tit = function (rotulo) { return '<tr class="titulos"><th colspan="4">' + rotulo + "</th>" + TIT_VAL + "</tr>"; };
    return '<h2 class="grupo-titulo">Empresa</h2><section class="caixa" id="cx-E">' +
      tabela("", "<thead>" + cabecalho("Empresa · por negócio", "EN", edita ? botaoNovo("EMPRESA", "N") : "") + tit("Negócio") + "</thead><tbody>" + linhasEmpresa(n, edita, "N", todas) + "</tbody>") +
      tabela("", "<thead>" + cabecalho("Empresa · por classificação", "EC", edita ? botaoNovo("EMPRESA", "C") : "") + tit("Classificação") + "</thead><tbody>" + linhasEmpresa(c, edita, "C", todas) + "</tbody>") +
      "</section>";
  }

  // ---- Arvore na mesma caixa: Superintendente (uma linha) > Gerente (uma linha) > detalhe.
  // A seta fica no inicio, junto do nome; abrir mostra o detalhamento por negocio.
  function seta(attr, chave, aberto, rotulo) {
    return '<button type="button" class="seta" ' + attr + '="' + esc(chave) + '" aria-expanded="' + !!aberto + '" aria-label="' + (aberto ? "Recolher " : "Exibir ") + esc(rotulo) + '">' + (aberto ? "▾" : "▸") + "</button>";
  }
  var TIT_SUP = '<tr class="titulos"><th colspan="2">Negócio</th><th colspan="2">Classificação</th>' + TIT_VAL + "</tr>";
  function linhasSuper(rs, edita, vazio) {
    if (!rs.length) return '<tr><td colspan="8" class="vazio">' + vazio + "</td></tr>";
    return rs.map(function (r) { return "<tr" + atributosLinha(r, "grande") + ">" + combo(r, "Negocio", edita, 2) + combo(r, "Classificacao", edita, 2) + valoresLinha(r, edita) + "</tr>"; }).join("");
  }
  function casaGerente(g) {
    if (!filtro) return true;
    var rs = nivel("GERENTE").filter(function (r) { return r.CodGerente === g; }).concat(prospeccoes(g));
    return casa(nomeGer(g, (rs[0] || {}).Gerente)) || rs.some(function (r) { return casa(textoLinha(r)); });
  }
  function supersVisiveis() {
    var supers = SUPER_OPERACIONAIS.slice();
    nivel("SUPERINTENDENTE").forEach(function (r) { if (r.CodSuperintendente && supers.indexOf(r.CodSuperintendente) < 0) supers.push(r.CodSuperintendente); });
    return supers.sort(porNomeSup);
  }
  function htmlSupers(edita) {
    var h = "";
    supersVisiveis().forEach(function (s) {
      var rs = nivel("SUPERINTENDENTE").filter(function (r) { return r.CodSuperintendente === s; });
      var nome = nomeSup(s, rs[0] ? rs[0].Superintendente : "");
      var nomeCasa = casa(nome);
      var gers = gerentesDoSuper(s);
      var gersCasam = gers.filter(casaGerente);
      if (filtro && !nomeCasa && !gersCasam.length) return;
      var aberto = !!abertos[s] || (!!filtro && !nomeCasa);
      var corpo = '<tr class="cab nivel1"><th colspan="4">' + seta("data-abrir", s, aberto, nome) + esc(nome) +
        '<span class="papel">Superintendente · ' + gers.length + (gers.length === 1 ? " gerente" : " gerentes") + "</span>" +
        (aberto && edita ? '<span class="dir">' + botaoNovo("SUPERINTENDENTE", s) + "</span>" : "") + "</th>" + celulasTotais("S:" + s) + "</tr>";
      if (aberto) {
        corpo += TIT_SUP + linhasSuper(rs, edita, "Sem meta cadastrada para o superintendente.") +
          linhaRef("Soma das metas dos gerentes", "SG:" + s, '<span data-tot="D:' + esc(s) + '|x">' + valorTotal("D:" + s + "|x") + "</span>");
        (filtro && !nomeCasa ? gersCasam : gers).forEach(function (g) { corpo += linhasGerente(g, edita); });
      }
      h += '<section class="caixa" id="cx-S-' + esc(s) + '">' + tabela("", "<tbody>" + corpo + "</tbody>") + "</section>";
    });
    if (!h) return "";
    return '<h2 class="grupo-titulo">Superintendentes e seus gerentes<span class="dir"><button type="button" class="btn abre peq" data-abrirtodos="1">Abrir todos</button><button type="button" class="btn abre peq" data-abrirtodos="0">Fechar todos</button></span></h2>' +
      '<section class="caixa" id="cx-ST">' + tabela("", "<thead>" + cabecalho("Superintendentes · total geral", "ST", "") + "</thead>") + "</section>" + h;
  }

  // ---- Gerente: uma linha com a meta (coluna L); aberto, mostra as linhas e a distribuicao
  function linhasGerente(g, edita) {
    var rs = nivel("GERENTE").filter(function (r) { return r.CodGerente === g; });
    var nome = nomeGer(g, (rs[0] || {}).Gerente);
    var aberto = !!abertosG[g] || (!!filtro && !casa(nome) && casaGerente(g));
    var h = '<tr class="cab nivel2" id="cx-G-' + esc(g) + '"><th colspan="4">' + seta("data-abrirg", g, aberto, nome) + esc(nome) + '<span class="papel">Gerente</span>' +
      (GER[g] ? "" : '<span class="nota">sem OS ativa na CTT</span>') +
      (aberto && edita ? '<span class="dir">' + botaoNovo("GERENTE", g) + "</span>" : "") + "</th>" + celulasTotais("G:" + g) + "</tr>";
    if (!aberto) return h;
    return h + TITULOS + linhasMeta(rs, edita, "Sem meta cadastrada para o gerente.", true);
  }
  function linhaProspeccao(r, edita) {
    var cli = edita
      ? '<input class="t" data-f="Cliente" value="' + esc(r.Cliente) + '" placeholder="Cliente" aria-label="Cliente"><input class="t" data-f="Descricao" value="' + esc(r.Descricao) + '" placeholder="Descrição" aria-label="Descrição">'
      : "<b>" + esc(r.Cliente) + "</b>" + (r.Descricao ? " · " + esc(r.Descricao) : "");
    return "<tr" + atributosLinha(r) + ">" + combo(r, "Negocio", edita) + "<td>" + esc(r.Classificacao || "PROSPECCAO") + "</td>" +
      texto(r, "ClassificacaoAdicional", edita, "Classificação adicional") + "<td>" + cli + "</td>" + valoresLinha(r, edita) + "</tr>";
  }

  // ---- Observacoes gerais do ano (mudancas de gerente/superintendente, revisoes): texto livre
  function linhaObs() {
    var r = nivel("OBSERVACAO")[0];
    if (!r) { r = linhaVazia("OBSERVACAO"); r._virtual = true; linhas.push(r); }
    return r;
  }
  function htmlObservacoes(edita) {
    var r = linhaObs();
    var corpo = edita
      ? '<textarea class="obs-geral" id="obsGeral" data-f="Justificativa" rows="8" aria-label="Observações gerais">' + esc(r.Justificativa) + "</textarea>"
      : (r.Justificativa ? '<div class="obs-geral leitura">' + esc(r.Justificativa) + "</div>" : '<div class="vazio">Nenhuma observação registrada.</div>');
    return '<h2 class="grupo-titulo">Observações gerais</h2><section class="caixa" id="cx-OBS"><table class="grade"><tbody><tr' + atributosLinha(r) + '><td>' + corpo + "</td></tr></tbody></table></section>";
  }
  function htmlLocacoes(edita) {
    var rs = nivel("NEGOCIO");
    if (!rs.length) return "";
    if (filtro && !casa("LOCACOES") && !rs.some(function (r) { return casa(textoLinha(r)); })) return "";
    var g = rs[0].CodGerente;
    return '<h2 class="grupo-titulo">Locações</h2><section class="caixa" id="cx-L">' +
      tabela("", "<thead>" + cabecalho('Locações<span class="papel">Gerente</span> ' + esc(nomeGer(g, rs[0].Gerente)) + '<span class="papel">Superintendente</span> ' + esc(nomeSupDoGerente(g)), "L", "") + TIT_SUP + "</thead><tbody>" +
        linhasSuper(rs, edita, "") + "</tbody>") + "</section>";
  }

  // Gerente com meta cujo superintendente na CTT nao e operacional (nao cabe em nenhuma caixa acima)
  function htmlOutrosGerentes(edita) {
    var mostrados = {};
    supersVisiveis().forEach(function (s) { gerentesDoSuper(s).forEach(function (g) { mostrados[g] = 1; }); });
    var outros = unicos(linhas.filter(function (r) { return (r.Nivel === "GERENTE" || r.Nivel === "PROSPECCAO") && r.CodGerente && !mostrados[r.CodGerente]; }).map(function (r) { return r.CodGerente; })).sort(porNomeGer).filter(casaGerente);
    if (!outros.length) return "";
    return '<h2 class="grupo-titulo">Outros gerentes</h2><section class="caixa">' + tabela("", "<tbody>" + outros.map(function (g) { return linhasGerente(g, edita); }).join("") + "</tbody>") + "</section>";
  }

  // ---- Responsavel (Gestor) da OS: cadastro de Responsaveis do Acompanhamento de Performance
  // (PARAM_ELEGIBILIDADE, Tipo RESPONSAVEL). Guarda o mes em que cada um assume; o fim e o mes
  // anterior ao proximo inicio. Nao usa o GESTOR DO CONTRATO da CTT, que reescreve o passado.
  function mesRef() {
    var d = new Date(), a = d.getFullYear();
    return ANO === a ? ANO * 100 + d.getMonth() + 1 : (ANO < a ? ANO * 100 + 12 : ANO * 100 + 1);
  }
  function mesAnterior(am) { var a = Math.floor(am / 100), m = am % 100; return m === 1 ? (a - 1) * 100 + 12 : a * 100 + m - 1; }
  function fmtMes(am) { return am ? ("0" + (am % 100)).slice(-2) + "/" + Math.floor(am / 100) : ""; }
  function historicoResp(cod) {
    var h = RESP.filter(function (p) { return String(p.valor || "").split("|")[0].trim().toUpperCase() === String(cod).toUpperCase(); })
      .map(function (p) { return { nome: String(p.valor).split("|").slice(1).join("|").trim(), inicio: parseInt(p.vigencia, 10) || 0 }; })
      .sort(function (a, b) { return a.inicio - b.inicio; });
    h.forEach(function (r, i) { r.fim = i + 1 < h.length ? mesAnterior(h[i + 1].inicio) : 0; });
    return h;
  }
  function gestorDaOS(cod) { var h = historicoResp(cod).filter(function (r) { return r.inicio <= mesRef(); }); return h.length ? h[h.length - 1] : null; }
  function nomeGestor(cod) {
    var g = gestorDaOS(cod);
    return g ? g.nome : (RESP_OK ? "SEM RESPONSÁVEL NO CADASTRO" : "CADASTRO DE RESPONSÁVEIS INDISPONÍVEL");
  }
  function textoHistorico(cod) {
    var h = historicoResp(cod);
    if (h.length < 2) return "";
    var ini = ANO * 100 + 1, atual = gestorDaOS(cod);
    var ant = h.filter(function (r) {
      var ehAtual = atual && r.inicio === atual.inicio && r.nome === atual.nome;
      return !ehAtual && r.inicio <= mesRef() && (!r.fim || r.fim >= ini);
    });
    return (atual ? "Gestor atual " + atual.nome + " desde " + fmtMes(atual.inicio) : "") +
      (ant.length ? " · antes: " + ant.map(function (r) { return r.nome + " (" + fmtMes(r.inicio) + " a " + fmtMes(r.fim) + ")"; }).join(", ") : "");
  }

  // ---- OS em arvore: Superintendente > Gerente > Gestor > OS, com meta x soma das OSs
  function arvoreOS() {
    var arv = {};
    montarOS().forEach(function (x) {
      var s = x.ctt.codSup, g = x.ger, t = nomeGestor(x.ctt.cod);
      arv[s] = arv[s] || {};
      arv[s][g] = arv[s][g] || {};
      (arv[s][g][t] = arv[s][g][t] || []).push(x);
    });
    return arv;
  }
  function casaOS(x) { return casa(x.ctt.desc + " " + x.ctt.negocio + " " + x.ctt.classificacao); }
  function celulas3(base) { return '<td class="n">' + celTotal(base, "f") + '</td><td class="n">' + celTotal(base, "r") + '</td><td class="n">' + celTotal(base, "p") + "</td>"; }
  var COL_OS = '<colgroup><col><col style="width:190px"><col style="width:210px"><col style="width:250px"><col style="width:250px"><col style="width:160px"><col style="width:280px"></colgroup>';
  function htmlOS(edita) {
    var arv = arvoreOS(), corpo = "";
    Object.keys(arv).sort(porNomeSup).forEach(function (s) {
      var nomeS = nomeSup(s), todasS = casa(nomeS);
      var chS = "S:" + s, abS = !!abertosOS[chS] || (!!filtro && !todasS);
      var blocoS = "";
      Object.keys(arv[s]).sort(porNomeGer).forEach(function (g) {
        var nomeG = nomeGer(g), todasG = todasS || casa(nomeG);
        var chG = "G:" + g, abG = !!abertosOS[chG] || (!!filtro && !todasG);
        var blocoG = "";
        Object.keys(arv[s][g]).sort().forEach(function (t) {
          var todasT = todasG || casa(t);
          var oss = arv[s][g][t].filter(function (x) { return todasT || casaOS(x); }).sort(function (a, b) { return a.ctt.cod.localeCompare(b.ctt.cod); });
          if (!oss.length) return;
          var chT = "T:" + g + "~" + t, abT = !!abertosOS[chT] || (!!filtro && !todasT);
          blocoG += '<tr class="no nivel3"><td colspan="3">' + seta("data-os-toggle", chT, abT, t) + '<span class="papel">Gestor</span> ' + esc(t) +
            ' <span class="dica">· ' + oss.length + (oss.length === 1 ? " OS" : " OSs") + "</span></td>" + celulas3("OT:" + g + "~" + t) + "<td></td></tr>";
          if (abT) oss.forEach(function (x) { blocoG += linhaOSHtml(x, edita); });
        });
        if (!blocoG) return;
        blocoS += '<tr class="no nivel2"><td colspan="3">' + seta("data-os-toggle", chG, abG, nomeG) + '<span class="papel">Gerente</span> ' + esc(nomeG) + "</td>" +
          celulas3("OG:" + g) + "<td></td></tr>";
        if (abG) blocoS += blocoG;
      });
      if (!blocoS) return;
      corpo += '<tr class="no nivel1"><td colspan="3">' + seta("data-os-toggle", chS, abS, nomeS) + '<span class="papel">Superintendente</span> ' + esc(nomeS) + "</td>" +
        celulas3("OSS:" + s) + "<td></td></tr>";
      if (abS) corpo += blocoS;
    });
    var h = '<h2 class="grupo-titulo">OS<span class="dir"><button type="button" class="btn abre peq" data-os-todos="1">Abrir todos</button><button type="button" class="btn abre peq" data-os-todos="0">Fechar todos</button></span></h2><section class="caixa" id="cx-OS">';
    if (!corpo) return h + '<div class="vazio">' + (Object.keys(OS_CTT).length ? "Nada no filtro." : "Nenhuma OS recebida da CTT.") + "</div></section>";
    return h + '<div class="rolagem"><table class="arvore">' + COL_OS +
      '<thead><tr><th>Superintendente · Gerente · Gestor · OS</th><th>Negócio</th><th>Classificação</th><th class="n">Faturamento</th><th class="n">Resultado</th><th class="n">% Margem</th><th>Situação</th></tr></thead><tbody>' + corpo + "</tbody></table></div></section>";
  }
  function linhaOSHtml(x, edita) {
    var r = x.r, o = x.ctt, hist = textoHistorico(o.cod);
    var h = "<tr" + atributosLinha(r, "folha") + ' data-os="' + esc(o.cod) + '"><td><div class="os">' + esc(o.desc) + "</div>" + (hist ? '<div class="desc">' + esc(hist) + "</div>" : "") + "</td>" +
      "<td>" + esc(o.negocio) + "</td><td>" + esc(o.classificacao) + "</td>" +
      numero(r, "FatMeta", edita, "Faturamento", false) + numero(r, "ResMeta", edita, "Resultado", r.EntradaPor === "MARGEM") + numero(r, "MargemMeta", edita, "Margem", r.EntradaPor !== "MARGEM") +
      '<td class="sit">' + chipsItem(x) + "</td></tr>";
    // Observacao da CTT fica na propria OS, destacada logo abaixo dela
    if (violacao(o)) h += '<tr class="obs"><td colspan="7">⚠ Observação da CTT: ' + esc(o.desc) + " está com " + esc(violacao(o)) + ". Corrigir o cadastro (ATIVO só em EXECUCAO, DEMOBILIZACAO ou NOVA; ATUAL e ENCERRADO sempre FINALIZADA).</td></tr>";
    return h;
  }
  function chipsItem(x) {
    var r = x.r, o = x.ctt, chips = [];
    if (violacao(o)) chips.push('<span class="chip viol">ver observação</span>');
    if (r.id && divergenciasCTT(x).length) chips.push('<span class="chip sync" title="A lista guarda outro valor; a CTT manda e a lista é atualizada ao salvar">CTT atualizou ' + esc(divergenciasCTT(x).join(", ")) + "</span>");
    return chips.join("");
  }
  function abrirCaminhoOS(cod) {
    var o = OS_CTT[cod];
    if (!o) return;
    abertosOS["S:" + o.codSup] = true;
    abertosOS["G:" + o.codGer] = true;
    abertosOS["T:" + o.codGer + "~" + nomeGestor(cod)] = true;
  }

  function combo(r, campo, edita, colspan) {
    var ops = opcoesCampo(campo), val = r[campo] || "";
    var o = ops.filter(function (x) { return x[0] === val; })[0];
    var td = colspan ? '<td colspan="' + colspan + '">' : "<td>";
    if (!edita) return td + esc(o && val ? o[1] : val) + "</td>";
    var rot = val ? (o ? o[1] : val) : "(em branco)";
    return td + '<button type="button" class="combo' + (val ? "" : " vazio") + (r.id && alterado(r, campo) ? " alterado" : "") + '" data-combo="' + campo + '" aria-haspopup="listbox" aria-expanded="false"' + (colspan ? ' style="max-width:470px"' : "") + "><span>" + esc(rot) + '</span><i aria-hidden="true">▼</i></button></td>';
  }
  function texto(r, campo, edita, rotulo) {
    if (!edita) return "<td>" + esc(r[campo]) + "</td>";
    return '<td><input class="t' + (r.id && alterado(r, campo) ? " alterado" : "") + '" data-f="' + campo + '" value="' + esc(r[campo]) + '" aria-label="' + esc(rotulo) + '"></td>';
  }
  function numero(r, campo, edita, rotulo, calculado) {
    var v = campo === "MargemMeta" ? fmtPct(r[campo]) : fmtVal(r[campo]);
    if (!edita) return '<td class="n">' + v + "</td>";
    return '<td class="n"><input class="v' + (calculado ? " calc" : "") + (alterado(r, campo) ? " alterado" : "") + '" data-f="' + campo + '" value="' + esc(v) + '" inputmode="decimal" aria-label="' + esc(rotulo) + '"' + (calculado ? ' title="Calculado; digite aqui para inverter o cálculo"' : "") + "></td>";
  }

  // ===========================================================================
  // Lista suspensa propria: a nativa abre deslocada dentro do visual do Power BI (o relatorio
  // e escalado e a caixa do sistema nao acompanha). Esta mora no documento, junto do campo.
  // ===========================================================================
  var comboAtual = null;
  function abrirCombo(btn) {
    fecharCombo();
    var tr = btn.closest("tr[data-uid]"), r = tr && porUid(tr.getAttribute("data-uid"));
    if (!r) return;
    var campo = btn.getAttribute("data-combo"), ops = opcoesCampo(campo);
    var fl = document.getElementById("flutuante");
    comboAtual = { btn: btn, r: r, campo: campo, ops: ops, vis: ops, ativo: 0, filtro: "" };
    var atual = ops.map(function (o) { return o[0]; }).indexOf(r[campo] || "");
    comboAtual.ativo = atual < 0 ? 0 : atual;
    fl.innerHTML = (ops.length > 8 ? '<input class="filtro-combo" type="text" placeholder="Digite para filtrar" aria-label="Filtrar opções">' : "") + '<div class="opcoes" role="listbox"></div>';
    desenharOpcoes();
    var rect = btn.getBoundingClientRect();
    fl.style.minWidth = Math.max(rect.width, 270) + "px";
    fl.style.left = (rect.left + window.pageXOffset) + "px";
    fl.style.top = (rect.bottom + window.pageYOffset + 3) + "px";
    fl.hidden = false;
    var larg = fl.offsetWidth, maxLeft = document.documentElement.clientWidth + window.pageXOffset - larg - 8;
    if (rect.left + window.pageXOffset > maxLeft) fl.style.left = Math.max(8, maxLeft) + "px";
    btn.setAttribute("aria-expanded", "true");
    var inp = fl.querySelector(".filtro-combo");
    if (inp) inp.focus();
    var a = fl.querySelector(".opcao.ativa"); if (a) a.scrollIntoView({ block: "nearest" });
  }
  function desenharOpcoes() {
    var c = comboAtual; if (!c) return;
    var fl = document.getElementById("flutuante");
    c.vis = c.ops.filter(function (o) { return !c.filtro || o[1].toUpperCase().indexOf(c.filtro.toUpperCase()) >= 0; });
    if (c.ativo >= c.vis.length) c.ativo = c.vis.length - 1;
    if (c.ativo < 0) c.ativo = 0;
    var val = c.r[c.campo] || "";
    fl.querySelector(".opcoes").innerHTML = c.vis.length ? c.vis.map(function (o, i) {
      return '<div role="option" class="opcao' + (i === c.ativo ? " ativa" : "") + (o[0] === val ? " atual" : "") + '" data-i="' + i + '" aria-selected="' + (o[0] === val) + '">' + esc(o[1]) + "</div>";
    }).join("") : '<div class="opcao">Nada encontrado</div>';
  }
  function fecharCombo(devolverFoco) {
    var fl = document.getElementById("flutuante");
    if (fl) { fl.hidden = true; fl.innerHTML = ""; }
    if (comboAtual) { comboAtual.btn.setAttribute("aria-expanded", "false"); if (devolverFoco) comboAtual.btn.focus(); }
    comboAtual = null;
  }
  function escolherOpcao(i) {
    var c = comboAtual; if (!c || !c.vis[i]) return;
    var v = c.vis[i][0], r = c.r, campo = c.campo, uid = r.uid;
    r[campo] = v;
    fecharCombo();
    render();
    var btn = document.querySelector('tr[data-uid="' + uid + '"] [data-combo="' + campo + '"]');
    if (btn) btn.focus();
  }

  // ===========================================================================
  // Edicao
  // ===========================================================================
  function porUid(uid) { return linhas.filter(function (r) { return r.uid === uid; })[0]; }
  function recalcular(r) {
    if (!r.FatMeta) { if (r.EntradaPor !== "MARGEM") r.MargemMeta = null; return; }
    if (r.EntradaPor === "MARGEM") { if (r.MargemMeta != null) r.ResMeta = Math.round(r.FatMeta * r.MargemMeta); }
    else if (r.ResMeta != null) r.MargemMeta = Math.round(r.ResMeta / r.FatMeta * 1e6) / 1e6;
    else r.MargemMeta = null;
  }
  function editar(el) {
    var tr = el.closest("tr[data-uid]");
    if (!tr) return;
    var r = porUid(tr.getAttribute("data-uid"));
    if (!r) return;
    var campo = el.getAttribute("data-f");
    msgStatus = ""; corStatus = "";
    if (campo === "FatMeta" || campo === "ResMeta" || campo === "MargemMeta") {
      var n = lerNumero(el.value);
      if (isNaN(n)) { msgStatus = "Valor inválido: use números, por exemplo 844.354.000"; corStatus = "erro"; atualizarNoLugar(r); return; }
      if (campo === "MargemMeta") { r.MargemMeta = n == null ? null : n / 100; r.EntradaPor = "MARGEM"; }
      else if (campo === "ResMeta") { r.ResMeta = n; r.EntradaPor = "RESULTADO"; }
      else r.FatMeta = n;
      if (!r.EntradaPor) r.EntradaPor = "RESULTADO";
      recalcular(r);
    } else if (campo === "Justificativa") {
      r[campo] = el.value.replace(/\s+$/, "");
    } else {
      r[campo] = semAcento(el.value).toUpperCase().trim();
    }
    atualizarNoLugar(r);
  }
  // Atualiza as copias da linha (a OS pode estar no cadastro rapido e no bloco de OS), os totais
  // e a barra. Redesenhar tudo tirava o foco do campo seguinte.
  function atualizarNoLugar(r) {
    document.querySelectorAll('tr[data-uid="' + r.uid + '"]').forEach(function (tr) {
      tr.querySelectorAll("input[data-f]").forEach(function (i) {
        var c = i.getAttribute("data-f"), numerico = c === "FatMeta" || c === "ResMeta" || c === "MargemMeta";
        if (i !== document.activeElement) {
          if (numerico) i.value = c === "MargemMeta" ? fmtPct(r[c]) : fmtVal(r[c]);
          else i.value = r[c] || "";
        }
        if (numerico) i.classList.toggle("calc", (c === "ResMeta" && r.EntradaPor === "MARGEM") || (c === "MargemMeta" && r.EntradaPor !== "MARGEM"));
        i.classList.toggle("alterado", numerico ? alterado(r, c) : !!(r.id && alterado(r, c)));
      });
      var sit = tr.querySelector("td.sit");
      if (sit) { var x = montarOS().filter(function (y) { return y.r.uid === r.uid; })[0]; if (x) sit.innerHTML = chipsItem(x); }
    });
    atualizarTotais();
    var barra = document.getElementById("barraMetas");
    if (barra) {
      var f = document.getElementById("filtro"), temFoco = f && f === document.activeElement;
      barra.innerHTML = htmlBarra(ehProprietario());
      if (temFoco) { var nf = document.getElementById("filtro"); if (nf) nf.focus(); }
    }
  }
  function novaLinha(nivelNovo, cod) {
    var r = linhaVazia(nivelNovo);
    if (nivelNovo === "EMPRESA") r._grupoEmp = cod === "C" ? "C" : "N";
    if (nivelNovo === "SUPERINTENDENTE") { r.CodSuperintendente = cod; r.Superintendente = nomeSup(cod); }
    if (nivelNovo === "GERENTE" || nivelNovo === "PROSPECCAO") {
      r.CodGerente = cod; r.Gerente = nomeGer(cod);
      r.CodSuperintendente = supDoGerente(cod); r.Superintendente = nomeSup(r.CodSuperintendente);
      var s = r.CodSuperintendente; if (s) abertos[s] = true; abertosG[cod] = true;
    }
    if (nivelNovo === "PROSPECCAO") r.Classificacao = "PROSPECCAO";
    linhas.push(r);
    filtro = "";
    render();
    var tr = document.querySelector('tr[data-uid="' + r.uid + '"]');
    if (tr) { tr.scrollIntoView({ block: "center" }); var el = tr.querySelector(".combo, input"); if (el) el.focus(); }
  }
  function remover(uid) {
    var r = porUid(uid);
    if (!r) return;
    if (!r.id) linhas = linhas.filter(function (x) { return x.uid !== uid; });
    else r.Ativo = r.Ativo === "Nao" ? "Sim" : "Nao";
    render();
  }

  // ===========================================================================
  // Gravacao
  // ===========================================================================
  function pendencias() {
    var novas = 0, alteradas = 0, ctt = 0, lista = [];
    linhas.forEach(function (r) {
      if (r.Nivel === "OS") return;
      if (r.Nivel === "OBSERVACAO" && !r.id && !r.Justificativa) return;
      if (!r.id) { novas++; lista.push({ r: r }); }
      else if (linhaAlterada(r)) { alteradas++; lista.push({ r: r }); }
      else if (divergeCTTLinha(r)) { ctt++; lista.push({ r: r }); }
    });
    montarOS().forEach(function (x) {
      var r = x.r, mudouValor = ["FatMeta", "ResMeta", "MargemMeta", "EntradaPor"].some(function (c) { return alterado(r, c); });
      if (!r.id) { if (r.FatMeta != null || r.ResMeta != null) { novas++; lista.push(x); } return; }
      if (mudouValor) { alteradas++; lista.push(x); }
      else if (divergenciasCTT(x).length) { ctt++; lista.push(x); }
    });
    return { novas: novas, alteradas: alteradas, ctt: ctt, total: novas + alteradas + ctt, lista: lista };
  }
  function proximaChave(prefixo) {
    var max = 0;
    linhas.forEach(function (r) {
      if (r.Title && r.Title.indexOf(prefixo + "|") === 0) { var n = parseInt(r.Title.slice(prefixo.length + 1), 10); if (n > max) max = n; }
    });
    return prefixo + "|" + ("000" + (max + 1)).slice(-3);
  }
  function validar(lista) {
    for (var i = 0; i < lista.length; i++) {
      var r = lista[i].r;
      if (r.Nivel === "OS" || r.Ativo === "Nao") continue;
      if (r.Nivel === "EMPRESA" && grupoEmpresa(r) === "N" && !r.Negocio) return "Linha da Empresa por negócio precisa do negócio.";
      if (r.Nivel === "EMPRESA" && grupoEmpresa(r) === "C" && !r.Classificacao) return "Linha da Empresa por classificação precisa da classificação.";
      if (r.Nivel === "PROSPECCAO" && (!r.CodGerente || !r.Negocio)) return "Toda prospecção precisa de negócio.";
      if (r.Nivel === "PROSPECCAO" && !r.Cliente) return "Informe o cliente da prospecção.";
    }
    return "";
  }
  function payload(x) {
    var r = x.r, campos = {};
    if (x.ctt) aplicarCTT(x); else aplicarCTTLinha(r);
    if (r.Nivel === "EMPRESA" && grupoEmpresa(r) === "C") r.Negocio = "";
    if (r.Nivel === "EMPRESA" && grupoEmpresa(r) === "N") r.Classificacao = "";
    if (!r.id) {
      if (r.Nivel === "OS") r.Title = ANO + "|OS|" + r.CodOS;
      else if (r.Nivel === "EMPRESA") r.Title = proximaChave(ANO + "|EMPRESA");
      else if (r.Nivel === "PROSPECCAO") r.Title = proximaChave(ANO + "|PROSPECCAO");
      else if (r.Nivel === "SUPERINTENDENTE") r.Title = proximaChave(ANO + "|SUPERINTENDENTE|" + r.CodSuperintendente);
      else if (r.Nivel === "GERENTE") r.Title = proximaChave(ANO + "|GERENTE|" + r.CodGerente);
      else r.Title = proximaChave(ANO + "|" + r.Nivel);
      campos.Title = r.Title; campos.Ano = ANO; campos.Nivel = r.Nivel; campos.CodOS = r.CodOS || "";
      campos.Situacao = "RASCUNHO"; campos.Origem = "APP";
    }
    ["CodGerente", "Gerente", "CodSuperintendente", "Superintendente", "Negocio", "Classificacao", "EntradaPor", "Ativo"].forEach(function (c) { campos[c] = r[c] || ""; });
    if (r.Nivel === "OS") campos.Nome = r.Nome;
    else if (r.Nivel === "OBSERVACAO") campos.Justificativa = r.Justificativa || "";
    else ["ClassificacaoAdicional", "Descricao", "Cliente"].forEach(function (c) { campos[c] = r[c] || ""; });
    campos.FatMeta = r.FatMeta; campos.ResMeta = r.ResMeta; campos.MargemMeta = r.MargemMeta;
    campos.AtualizadoPor = sessao.login; campos.AtualizadoEm = new Date().toISOString();
    return { id: r.id, campos: campos };
  }
  // Grava tudo o que esta pendente (inclusive a OS do cadastro rapido) e recarrega da lista
  async function salvar(mensagemOk) {
    var p = pendencias();
    var erro = validar(p.lista);
    confirmando = false;
    if (erro) { msgStatus = erro; corStatus = "erro"; render(); return false; }
    if (!p.total) { msgStatus = "Nada para gravar."; corStatus = ""; render(); return false; }
    gravando = true; msgStatus = "Gravando " + p.total + (p.total === 1 ? " linha..." : " linhas..."); corStatus = ""; render();
    var itens = p.lista.map(payload), falha = "";
    try {
      for (var i = 0; i < itens.length; i += LOTE) {
        var res = await postar(FLOW.gravar, { login: sessao.login, hash: sessao.hash, itens: itens.slice(i, i + LOTE) });
        if (res.status !== 200) {
          falha = res.status === 403 ? "Somente o proprietário pode gravar metas." : "Falha ao gravar no SharePoint (HTTP " + res.status + "). " + (i ? i + " linhas já tinham sido gravadas." : "Nada foi gravado.");
          break;
        }
      }
    } catch (e) { falha = "Falha de conexão ao gravar."; }
    gravando = false;
    await carregar();
    msgStatus = falha || mensagemOk || ("Gravado: " + itens.length + (itens.length === 1 ? " linha." : " linhas."));
    corStatus = falha ? "erro" : "ok";
    render();
    return !falha;
  }
  async function gravarRapido() {
    var x = montarOS().filter(function (y) { return y.ctt.cod === rapidoOS; })[0];
    if (!x) return;
    if (!(x.r.FatMeta > 0)) { msgStatus = "Informe o faturamento da OS antes de gravar."; corStatus = "erro"; render(); return; }
    var ok = await salvar("Meta gravada: " + x.ctt.desc + ".");
    if (ok) { rapidoOS = ""; render(); }
  }

  // ===========================================================================
  // Eventos (delegados: a tela e redesenhada a cada mudanca de estrutura)
  // ===========================================================================
  document.addEventListener("click", function (ev) {
    var op = ev.target.closest(".opcao[data-i]");
    if (op && comboAtual) { escolherOpcao(parseInt(op.getAttribute("data-i"), 10)); return; }
    if (comboAtual && !ev.target.closest("#flutuante") && ev.target.closest("[data-combo]") !== comboAtual.btn) fecharCombo();
    var t = ev.target.closest("button");
    if (!t) return;
    if (t.hasAttribute("data-combo")) { if (comboAtual && comboAtual.btn === t) fecharCombo(); else abrirCombo(t); return; }
    if (t.hasAttribute("data-aba")) { abaAtiva = t.getAttribute("data-aba"); render(); return; }
    if (t.hasAttribute("data-abrir")) { var s = t.getAttribute("data-abrir"); abertos[s] = !abertos[s]; render(); var b = document.querySelector('[data-abrir="' + s + '"]'); if (b) b.focus(); return; }
    if (t.hasAttribute("data-abrirtodos")) { var abrir = t.getAttribute("data-abrirtodos") === "1"; supersVisiveis().forEach(function (x) { abertos[x] = abrir; gerentesDoSuper(x).forEach(function (g) { abertosG[g] = abrir; }); }); render(); return; }
    if (t.hasAttribute("data-abrirg")) {
      var gg = t.getAttribute("data-abrirg");
      abertosG[gg] = !abertosG[gg];
      render();
      var bg = document.querySelector('[data-abrirg="' + gg + '"]'); if (bg) bg.focus();
      return;
    }
    if (t.hasAttribute("data-os-toggle")) {
      var ko = t.getAttribute("data-os-toggle");
      abertosOS[ko] = !abertosOS[ko];
      render();
      var bo = [].filter.call(document.querySelectorAll("[data-os-toggle]"), function (e) { return e.getAttribute("data-os-toggle") === ko; })[0];
      if (bo) bo.focus();
      return;
    }
    if (t.hasAttribute("data-os-todos")) {
      var abrirOS = t.getAttribute("data-os-todos") === "1", arv = arvoreOS();
      Object.keys(arv).forEach(function (sx) {
        abertosOS["S:" + sx] = abrirOS;
        Object.keys(arv[sx]).forEach(function (g) {
          abertosOS["G:" + g] = abrirOS;
          Object.keys(arv[sx][g]).forEach(function (tt) { abertosOS["T:" + g + "~" + tt] = abrirOS; });
        });
      });
      render();
      return;
    }
    if (t.hasAttribute("data-rapido")) {
      var c = t.getAttribute("data-rapido");
      rapidoOS = rapidoOS === c ? "" : c;
      render();
      var inp = document.querySelector("#cx-rapido input[data-f='FatMeta']");
      if (inp) { inp.focus(); inp.select(); }
      return;
    }
    if (t.hasAttribute("data-ir")) { filtro = ""; focoAlvo = t.getAttribute("data-ir"); if (focoAlvo.indexOf("os:") === 0) abrirCaminhoOS(focoAlvo.slice(3)); render(); return; }
    if (t.hasAttribute("data-novo")) { novaLinha(t.getAttribute("data-novo"), t.getAttribute("data-cod") || ""); return; }
    if (t.hasAttribute("data-remover")) { remover(t.getAttribute("data-remover")); return; }
    var a = t.getAttribute("data-acao");
    if (a === "sair") { sessao = null; gravarSessao(null); linhas = []; erroCarga = ""; rapidoOS = ""; render(); }
    else if (a === "recarregar") { msgStatus = ""; carregar(); }
    else if (a === "salvar") { confirmando = true; render(); }
    else if (a === "cancelarSalvar") { confirmando = false; render(); }
    else if (a === "confirmarSalvar") salvar();
    else if (a === "gravarRapido") gravarRapido();
    else if (a === "fecharRapido") { rapidoOS = ""; render(); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.matches("#painel input[data-f], #painel textarea[data-f]")) editar(ev.target);
  });
  document.addEventListener("keydown", function (ev) {
    if (comboAtual) {
      var c = comboAtual;
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();
        c.ativo += ev.key === "ArrowDown" ? 1 : -1;
        desenharOpcoes();
        var a = document.querySelector("#flutuante .opcao.ativa"); if (a) a.scrollIntoView({ block: "nearest" });
        return;
      }
      if (ev.key === "Enter") { ev.preventDefault(); escolherOpcao(c.ativo); return; }
      if (ev.key === "Escape") { ev.preventDefault(); fecharCombo(true); return; }
      if (ev.key === "Tab") { fecharCombo(); return; }
    } else if ((ev.key === "ArrowDown" || ev.key === " ") && ev.target.matches && ev.target.matches("[data-combo]")) {
      ev.preventDefault(); abrirCombo(ev.target); return;
    }
    if (ev.key === "Enter" && ev.target.matches("#painel input[data-f]")) { ev.preventDefault(); ev.target.blur(); }
  });
  var tFiltro = null;
  document.addEventListener("input", function (ev) {
    if (ev.target.classList && ev.target.classList.contains("filtro-combo") && comboAtual) {
      comboAtual.filtro = ev.target.value; comboAtual.ativo = 0; desenharOpcoes(); return;
    }
    if (ev.target.id !== "filtro") return;
    clearTimeout(tFiltro);
    tFiltro = setTimeout(function () {
      filtro = ev.target.value;
      var pos = ev.target.selectionStart;
      render();
      var f = document.getElementById("filtro");
      if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (e) {} }
    }, 250);
  });
  window.addEventListener("resize", function () { fecharCombo(); });

  // ===========================================================================
  sessao = lerSessao();
  render();
  if (sessao) carregar();
})();
</script>
</body>
